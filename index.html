<style>
:root{
  --paper:#F2F3F1; --surface:#FFFFFF; --ink:#1F2328; --ink2:#4E555D; --muted:#868D96; --line:#DFE2E4; --line2:#ECEEEF;
  --side:#1F2328; --side2:#2A2F35; --sideink:#C9CDD2;
  --stat:#1F6FB0; --band:#C2872B; --ok:#2E7D4F; --warn:#A86500; --bad:#B3261E;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,sans-serif;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stat);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sideink);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:8px 4px 26px}
.brand > span:first-child svg{width:44px;height:29px;display:block}

aside nav{display:flex;flex-direction:column;gap:2px}
aside nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--sideink);text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;font-weight:500}
aside nav button:hover{background:var(--side2);color:#fff}
aside nav button.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 #fff}
aside nav .sep{height:1px;background:var(--side2);margin:10px 8px}
aside nav small{color:#6E757D;font-size:12px;padding:4px 10px 2px}
.mini{margin-top:auto;background:var(--side2);border-radius:8px;padding:12px;color:#fff;cursor:pointer}
.mini .c{font-size:22px;font-weight:700;color:var(--band)}
.mini .s{font-size:12px;color:var(--sideink)}
.save{font-size:12px;color:#6E757D;padding:8px 10px 0}
main{padding:32px 40px 60px;max-width:1180px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.015em}
.lead{color:var(--ink2);margin:6px 0 0}
h3{font-size:16px;margin:0 0 12px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.p:hover{background:#000}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.q{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.q:hover{background:var(--line2)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.fig{padding:16px 20px;border-left:1px solid var(--line2)}
.fig:first-child{border-left:0}
.fig .v{font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.fig .k{color:var(--ink2);font-size:13px}
.fig.total{background:var(--ink);color:#fff}
.fig.total .k{color:#B9BEC4}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#F7F8F7}
.r{text-align:right}
.b{font-weight:600}
.dim{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--ink2)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.tag.ok::before{background:var(--ok)} .tag.ok{color:var(--ok)}
.tag.warn::before{background:var(--warn)} .tag.warn{color:var(--warn)}
.tag.bad::before{background:var(--bad)} .tag.bad{color:var(--bad)}
.tag.on::before{background:var(--stat)}
.seg{display:inline-flex;background:var(--line2);border-radius:7px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:5px;cursor:pointer;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(31,35,40,.12)}
.yr{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:18px}
.yr button{border:1px solid var(--line);background:var(--surface);width:30px;height:30px;border-radius:6px;cursor:pointer}
.empty{padding:40px 16px;text-align:center;color:var(--ink2)}
.empty p{margin:0 0 14px}
label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:5px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.f{margin-bottom:12px}
.fr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);cursor:pointer}
.chk input{width:auto;margin:0}
.ov{position:fixed;inset:0;background:rgba(20,22,25,.5);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto;z-index:30}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;padding:26px}
.modal h2{margin:0 0 18px;font-size:21px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-weight:500;z-index:60}
.note{background:#FFF7E8;border:1px solid #F0D9A8;padding:10px 14px;border-radius:8px;margin-bottom:18px;font-size:14px}
/* timer */
.timer{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
.clock{font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1;min-width:230px}
.clock.run{color:var(--band)}
.go{width:64px;height:64px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:22px;cursor:pointer}
.go.stop{background:var(--band)}
/* event rows */
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line2);align-items:center;cursor:pointer}
.ev:hover{background:#F7F8F7}
.ev:last-child{border-bottom:0}
.ev .d{text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 0;line-height:1.1}
.ev .d b{display:block;font-size:22px}
.ev .d span{font-size:12px;color:var(--muted)}
.ev .t{font-weight:600}
.ev .m{font-size:13px;color:var(--ink2)}
/* chart */
.legend{display:flex;gap:18px;font-size:13px;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:8px 10px;border-radius:6px;font-size:13px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;display:none;z-index:5}
/* invoice editor */
.ed{position:fixed;inset:0;background:var(--paper);z-index:25;display:grid;grid-template-columns:minmax(380px,460px) 1fr;}
.ed .form{overflow:auto;padding:22px 24px 40px;background:var(--surface);border-right:1px solid var(--line)}
.ed .prev{overflow:auto;padding:28px;display:flex;justify-content:center}
.ed .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
.ed h2{margin:0;font-size:20px}
.ed .sec{border-top:1px solid var(--line2);padding-top:14px;margin-top:6px}
.ed .sec > .t{font-weight:600;margin-bottom:10px}
.it{display:grid;grid-template-columns:72px 60px 1fr 32px;gap:6px;margin-bottom:12px;align-items:center}
.it .dsc{grid-column:1/-1}
.it input{padding:6px 8px}
.paperwrap{transform-origin:top center;box-shadow:0 2px 18px rgba(31,35,40,.12)}
pre.mail{white-space:pre-wrap;background:var(--paper);padding:14px;border-radius:8px;margin:0;font:14px/1.55 "Schibsted Grotesk",sans-serif}
@media (max-width:900px){
  .app{grid-template-columns:1fr} aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center} aside nav{flex-direction:row;flex-wrap:wrap} aside nav .sep,aside nav small,.save{display:none} .mini{margin:0}
  main{padding:22px 16px}
  .ed{grid-template-columns:1fr;overflow:auto} .ed .form{overflow:visible} .ed .prev{display:none}
  .timer{grid-template-columns:1fr}
}
@media (max-width:700px){
  body{font-size:15px}
  .app{grid-template-columns:minmax(0,1fr)!important}main{min-width:0;max-width:100vw;overflow-x:hidden}
  .modal [data-sb],.modal [data-sf]{width:72px!important;padding:5px 6px!important}.modal table th,.modal table td{padding:6px 4px}
  aside .brand{flex:1}
  td.r,th.r{white-space:nowrap}.modal .panel{overflow-x:auto}.modal [data-sb]{width:64px!important}.modal [data-sf]{width:52px!important}
  input,select,textarea{font-size:16px!important}
  aside{position:sticky;top:0;z-index:20;padding:10px 12px calc(8px);gap:6px;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  aside .brand{margin:0;order:1}aside .lockbtn{order:2;margin:0;padding:6px 10px}
  aside nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:2px 12px 2px;width:calc(100% + 24px)}
  aside nav::-webkit-scrollbar{display:none}
  aside nav button{white-space:nowrap;padding:7px 12px;flex:none}
  aside nav button.on{box-shadow:inset 0 -2px 0 #fff}
  #mini{order:4;width:100%}#mini:empty{display:none}.mini{padding:8px 10px}
  main{padding:18px 14px calc(40px + env(safe-area-inset-bottom))}
  h1{font-size:24px}.head{margin-bottom:18px;align-items:flex-start}.head .lead{font-size:14px}
  .head > div:last-child{flex-wrap:wrap}
  .figs{grid-template-columns:1fr 1fr}.fig{padding:14px}.fig .v{font-size:20px}
  .cols{grid-template-columns:1fr;gap:14px}
  .panel{padding:14px;overflow-x:auto}
  table{min-width:0}th,td{padding:8px 6px}
  .ev{grid-template-columns:52px 1fr;gap:12px}.ev > .r{grid-column:2;text-align:left}
  .ov{padding:0;align-items:stretch}.modal{border-radius:0;max-width:none;min-height:100%;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .mfoot{position:sticky;bottom:0;background:var(--surface);padding-top:10px}
  .clock{font-size:40px;min-width:0}.timer{gap:14px}.go{justify-self:start}
  .ed .prev{display:block;overflow:hidden;padding:12px;border-top:1px solid var(--line)}
  .gate .day{font-size:38px}
  .tbar{margin-bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- invoice paper ---------- */
.inv{width:794px;height:1123px;background:#fff;color:#1F2328;font:12.5px/1.5 "Schibsted Grotesk",Arial,sans-serif;padding:52px 56px 34px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.inv .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px}
.inv .logo{display:flex;align-items:center;gap:20px}
.inv .logo svg{width:84px;height:56px;display:block}

.inv .logo img{max-height:56px;max-width:220px}
.inv .ttl{text-align:right}
.inv .ttl .w{font-size:13px;color:#868D96}
.inv .ttl .n{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.05}
.inv .ttl .s{font-size:13px;color:#4E555D;margin-top:2px}
.inv .lab{font-size:11.5px;color:#868D96;margin-bottom:6px}

<link rel="manifest" href="manifest.webmanifest">

<script>/* LNStatik – úložisko v OneDrive (Microsoft Graph) namiesto claude.ai.
   Poskytuje rovnaké rozhranie ako claude.use('db'|'user'|'downloads'|'assets'). */
(function(){
const CFG=window.LNS_CONFIG||{};
const SCOPES=['User.Read','Files.ReadWrite'];
const GRAPH='https://graph.microsoft.com/v1.0';
const BASES=['Dokumenty/1-- LNStatik/4_LNStatik/2_Financie','Documents/1-- LNStatik/4_LNStatik/2_Financie','1-- LNStatik/4_LNStatik/2_Financie'];
const DATA_DIR='LNStatik_data',DATA_FILE='lnstatik_data.json',ATT_DIR='Prilohy';
const enc=p=>p.split('/').map(encodeURIComponent).join('/');

let msal=null,account=null;
const AUTH={ok:false,ready:false,err:'',user:''};
window.AUTH=AUTH;

AUTH.loginHTML=function(){
  if(!CFG.clientId)return `<div class="gate"><div class="lg">${(typeof sig!=='undefined'?sig(15,'#8B929B','#1F2328'):'')}</div><p class="dim">Appka ešte nie je prepojená s Microsoft 365 (chýba Client ID v config.js).</p></div>`;
  return `<div class="gate"><div class="lg">${(typeof sig!=='undefined'?sig(15,'#8B929B','#1F2328'):'')}</div>
   <div class="day" style="font-size:26px">Prihlásenie</div><div class="dt" style="text-transform:none">Dáta sú uložené v tvojom OneDrive.</div>
   ${AUTH.err?`<p style="color:var(--bad);font-size:14px">${AUTH.err}</p>`:''}
   <button class="gb" onclick="AUTH.login()"><span>Prihlásiť sa cez Microsoft<small>Konto LN-Statika</small></span><span class="ar">›</span></button></div>`};
AUTH.login=()=>msal.loginRedirect({scopes:SCOPES,prompt:'select_account'});
AUTH.logout=()=>msal.logoutRedirect({account});

async function token(sc){sc=sc||SCOPES;
  try{return (await msal.acquireTokenSilent({scopes:sc,account})).accessToken}
  catch(e){if(sc!==SCOPES){try{sessionStorage.setItem('lns_after_consent','1')}catch(x){}await msal.acquireTokenRedirect({scopes:sc,account});const er=new Error('Presmerovanie na povolenie Outlooku');er.redirect=true;throw er}await msal.acquireTokenRedirect({scopes:sc,account});throw e}}
async function g(path,opt={}){
  const t=await token();
  return fetch(path.startsWith('http')?path:GRAPH+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}})}

// ---------- dáta ----------
let lastSnap=null,base=null,state={items:{},u:{},del:{}},etag=null,dirty={},listeners=[],saving=null,timer=null,loaded=false;
const FILE=()=>`/me/drive/root:/${enc(base+'/'+DATA_DIR+'/'+DATA_FILE)}`;
async function findBase(){
  if(CFG.basePath){base=CFG.basePath;return}
  for(const b of BASES){const r=await g(`/me/drive/root:/${enc(b)}?$select=id`);if(r.ok){base=b;return}}
  base='LNStatik';}
function emit(fromCache){const docs=Object.entries(state.items).map(([id,d])=>({id,exists:true,data:()=>JSON.parse(JSON.stringify(d))}));
  listeners.forEach(f=>{try{f({docs,metadata:{fromCache:!!fromCache}})}catch(e){console.error(e)}})}
async function pull(){
  const m=await g(FILE()+'?$select=eTag,id');
  if(m.status===404){etag=null;return {items:{},u:{},del:{}}}
  if(!m.ok)throw new Error('read '+m.status);
  const meta=await m.json();const c=await g(FILE()+':/content');if(!c.ok)throw new Error('read '+c.status);
  const j=await c.json();etag=meta.eTag;return {items:j.items||{},u:j.u||{},del:j.del||{}}}
function merge(remote){
  const out={items:{...remote.items},u:{...remote.u},del:{...remote.del}};
  for(const [id,ts] of Object.entries(dirty)){
    const rts=Math.max(remote.u[id]||0,remote.del[id]||0);if(rts>ts)continue;
    if(state.items[id]!==undefined){out.items[id]=state.items[id];out.u[id]=ts;delete out.del[id]}
    else{delete out.items[id];delete out.u[id];out.del[id]=ts}}
  state=out}
async function push(){
  const body=JSON.stringify({app:'LNStatik',verzia:1,ulozene:new Date().toISOString(),items:state.items,u:state.u,del:state.del});
  const sent={...dirty};
  const r=await g(FILE()+':/content',{method:'PUT',headers:{'Content-Type':'application/json',...(etag?{'If-Match':etag}:{})},body});
  if(r.status===412||r.status===409){merge(await pull());emit(false);return push()}
  if(!r.ok)throw new Error('write '+r.status);
  etag=(await r.json()).eTag;
  try{const d=new Date().toISOString().slice(0,10);if(lastSnap!==d){lastSnap=d;snapshot(d,body)}}catch(e){console.warn('snapshot',e)}
  for(const [id,ts] of Object.entries(sent))if(dirty[id]===ts)delete dirty[id]}
function schedule(){clearTimeout(timer);setStatus('Ukladám…');timer=setTimeout(flush,800)}
async function flush(){if(saving)return saving;
  saving=(async()=>{try{while(Object.keys(dirty).length)await push();setStatus('Uložené v OneDrive')}
    catch(e){console.error(e);setStatus('Neuložené – skúsim znova');clearTimeout(timer);timer=setTimeout(flush,8000)}
    finally{saving=null}})();return saving}
function setStatus(t){const s=document.getElementById('status');if(s)s.textContent=t}
async function poll(){if(!loaded||document.hidden||Object.keys(dirty).length||saving)return;
  try{const m=await g(FILE()+'?$select=eTag');if(!m.ok)return;const e=(await m.json()).eTag;if(e!==etag){state=await pull();emit(false)}}catch(e){}}
setInterval(poll,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
window.addEventListener('beforeunload',e=>{if(Object.keys(dirty).length){flush();e.preventDefault();e.returnValue=''}});

const col={doc:id=>({
    set:async d=>{state.items[id]=JSON.parse(JSON.stringify(d));state.u[id]=Date.now();delete state.del[id];dirty[id]=state.u[id];schedule()},
    delete:async()=>{delete state.items[id];delete state.u[id];state.del[id]=Date.now();dirty[id]=state.del[id];schedule()}}),
  onSnapshot:(f,err)=>{listeners.push(f);ready.then(()=>emit(false)).catch(e=>err&&err(e));return()=>{listeners=listeners.filter(x=>x!==f)}}};

// denná záloha: gzip, ponechá 7 posledných dní + 1 za každý mesiac (12 mesiacov)
async function snapshot(d,body){const dir=base+'/'+DATA_DIR+'/zalohy';let blob=new Blob([body],{type:'application/json'}),ext='.json';
  if(window.CompressionStream){blob=await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();ext='.json.gz'}
  await g(`/me/drive/root:/${enc(dir+'/lnstatik_data_'+d+ext)}:/content`,{method:'PUT',headers:{'Content-Type':'application/octet-stream'},body:blob});
  const r=await g(`/me/drive/root:/${enc(dir)}:/children?$select=id,name&$top=500`);if(!r.ok)return;const files=((await r.json()).value||[]).map(f=>({...f,d:(f.name.match(/(\d{4}-\d{2}-\d{2})/)||[])[1]})).filter(f=>f.d).sort((a,b)=>b.d.localeCompare(a.d));
  const keep=new Set();files.slice(0,7).forEach(f=>keep.add(f.id));const months={};files.forEach(f=>{const m=f.d.slice(0,7);if(!months[m])months[m]=f});Object.values(months).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,12).forEach(f=>keep.add(f.id));
  for(const f of files)if(!keep.has(f.id))await g(`/me/drive/items/${encodeURIComponent(f.id)}`,{method:'DELETE'})}

// ---------- prílohy ----------
async function attFolder(){return base+'/'+DATA_DIR+'/'+ATT_DIR}
const assets={
  upload:async(file,{type}={})=>{const name=Date.now().toString(36)+'_'+(file.name||'priloha').replace(/[\\/:*?"<>|#%]/g,'_');
    const path=`/me/drive/root:/${enc((await attFolder())+'/'+name)}`;let item;
    if(file.size<=4*1024*1024){const r=await g(path+':/content',{method:'PUT',headers:{'Content-Type':type||file.type||'application/octet-stream'},body:file});if(!r.ok)throw new Error('upload '+r.status);item=await r.json()}
    else{const s=await g(path+':/createUploadSession',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const {uploadUrl}=await s.json();
      const CH=5*327680;for(let o=0;o<file.size;o+=CH){const part=file.slice(o,o+CH);const r=await fetch(uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${o}-${o+part.size-1}/${file.size}`},body:part});if(!r.ok)throw new Error('upload '+r.status);if(r.status===200||r.status===201)item=await r.json()}}
    return {id:item.id,contentType:(item.file&&item.file.mimeType)||type||file.type,sizeBytes:item.size}},
  delete:async id=>{await g(`/me/drive/items/${encodeURIComponent(id)}`,{method:'DELETE'})}};
async function openAtt(id){const w=window.open('about:blank','_blank');
  try{const r=await g(`/me/drive/items/${encodeURIComponent(id)}?$select=@microsoft.graph.downloadUrl,webUrl,file`);const j=await r.json();
    const u=j['@microsoft.graph.downloadUrl']||j.webUrl;if(w)w.location=u;else location.href=u}catch(e){if(w)w.close();alert('Prílohu sa nepodarilo otvoriť.')}}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="/_blob/"]');if(!a)return;e.preventDefault();e.stopPropagation();openAtt(decodeURIComponent(a.getAttribute('href').slice(7)))},true);

// ---------- PDF faktúr do OneDrive ----------
AUTH.savePdf=async(inv,blob)=>{if(!base)return;const y=String(inv.issueDate||'').slice(0,4)||'bez_roku';const n=String(inv.number||'faktura').replace(/[^\w-]/g,'');
  try{await g(`/me/drive/root:/${enc(base+'/LNStatik_zaloha/Faktury_PDF/'+y+'/Faktura_'+n+'.pdf')}:/content`,{method:'PUT',headers:{'Content-Type':'application/pdf'},body:blob})}catch(e){console.warn('pdf',e)}};

// ---------- Outlook koncept ----------
AUTH.mailDraft=async({subject,html,to,pdfs,logo})=>{const t=await token(['Mail.ReadWrite']);
  const att=pdfs.map(p=>({'@odata.type':'#microsoft.graph.fileAttachment',name:p.name,contentType:'application/pdf',contentBytes:p.b64}));
  if(logo)att.push({'@odata.type':'#microsoft.graph.fileAttachment',name:'lnstatik.png',contentType:'image/png',contentBytes:logo,isInline:true,contentId:'lnlogo@lnstatik'});
  const r=await fetch(GRAPH+'/me/messages',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify({subject,body:{contentType:'HTML',content:html},toRecipients:String(to||'').split(/[,;]\s*/).filter(Boolean).map(a=>({emailAddress:{address:a}})),attachments:att})});
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(m||('Outlook '+r.status))}
  const j=await r.json();return j.webLink||'https://outlook.office.com/mail/drafts'};

// ---------- sťahovanie ----------
const downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}};

// ---------- štart ----------
let readyRes,readyRej;const ready=new Promise((a,b)=>{readyRes=a;readyRej=b});
async function start(){
  if(!CFG.clientId||!window.msal){AUTH.ready=true;return}
  msal=new window.msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+(CFG.tenantId||'organizations'),redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
  await msal.initialize();
  try{const r=await msal.handleRedirectPromise();if(r&&r.account)account=r.account}catch(e){AUTH.err='Prihlásenie zlyhalo: '+(e.errorMessage||e.message||e)}
  account=account||msal.getAllAccounts()[0]||null;
  AUTH.ready=true;
  if(!account){if(window.render)render();return}
  AUTH.ok=true;AUTH.user=account.username||'';if(window.render)render();
  try{if(sessionStorage.getItem('lns_after_consent')){sessionStorage.removeItem('lns_after_consent');setTimeout(()=>{try{toast('Outlook je povolený. Otvor faktúru a klikni znova na Otvoriť v Outlooku.')}catch(x){}},1500)}}catch(x){}
  try{await findBase();state=await pull();loaded=true;readyRes()}catch(e){console.error(e);AUTH.err='Nepodarilo sa načítať dáta z OneDrive.';readyRej(e)}
}
const started=start();
window.claude={use:async k=>{await started;if(!AUTH.ok)return null;
  if(k==='db')return {collection:()=>col};
  if(k==='user')return {id:async()=>'me'};
  if(k==='downloads')return downloads;
  if(k==='assets')return assets;return null}};
})();
</script>

<script>
// ===== utilities =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const eur=n=>(Number(n)||0).toLocaleString('sk-SK',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const eur0=n=>Math.round(Number(n)||0).toLocaleString('sk-SK')+' €';
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const fd=s=>{if(!s)return'';const d=new Date(s+'T12:00');return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`};
const MON=['jan','feb','mar','apr','máj','jún','júl','aug','sep','okt','nov','dec'];
const dur=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`};
const hrs=ms=>ms/36e5;
const fh=ms=>hrs(ms).toLocaleString('sk-SK',{maximumFractionDigits:1})+' h';
const loc=ms=>{const d=new Date(ms);return `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function sure(btn,label){if(btn.dataset.s)return true;btn.dataset.s=1;const o=btn.textContent;btn.textContent=label||'Naozaj?';setTimeout(()=>{delete btn.dataset.s;btn.textContent=o},3000);return false}

// ===== logo =====
let lnId=0;
const lnMark=(hgt,lc,nc)=>{const id='lc'+(lnId++);return `<svg viewBox="15.7 0 59.8 40" height="${hgt}" width="${(hgt*59.8/40).toFixed(1)}" style="display:block;flex:none;overflow:visible"><defs><clipPath id="${id}"><path d="M-10 -10 H200 V50 H-10 Z M53 44 L40.8 25 L200 25 L200 50 Z" clip-rule="evenodd"/></clipPath></defs><path clip-path="url(#${id})" d="M19.7 0 V28 Q19.7 36 27.7 36 H60" fill="none" stroke="${lc}" stroke-width="8"/><path d="M35.5 28 V11 Q35.5 4 42 4 Q45 4 47 7 L64.5 32.5 Q67 36 70 36 Q71.5 36 71.5 33 V0" fill="none" stroke="${nc}" stroke-width="8" stroke-linejoin="round"/></svg>`};
const sig=(size,color,ink,lcol)=>`<span style="display:inline-flex;align-items:center;gap:${(size*1.4).toFixed(1)}px;white-space:nowrap">${lnMark(Math.round(size*2.0),lcol||'#9AA0A8',ink||'#1F2328')}<span style="font-family:Outfit,sans-serif;font-weight:200;font-size:${size}px;letter-spacing:.62em;margin-right:-.62em;line-height:1;color:${color}">· STATIK</span></span>`;
function logoSVG(front,back,knock){
  return `<svg viewBox="0 0 120 80" aria-hidden="true"><path d="M34 76 L66 8 L98 76" fill="none" stroke="${back}" stroke-width="8.5" stroke-linejoin="miter" stroke-miterlimit="10"/><path d="M8 76 L40 18 L72 76" fill="none" stroke="${knock}" stroke-width="18.7" stroke-linejoin="miter" stroke-miterlimit="10"/><path d="M8 76 L40 18 L72 76" fill="none" stroke="${front}" stroke-width="8.5" stroke-linejoin="miter" stroke-miterlimit="10"/></svg>`;
}
function drawBrand(){$('#brand').innerHTML=sig(12,'#9AA0A8','#F4F5F6','#7C838B')}

// ===== imported data (from Excel) =====
const SIGN='';
const DESC='Vypracovanie dokumentácie a projektu jednoduchých stavieb';
const IMPORT={biz:{},clients:[],invoices:[]};

// ===== state / storage =====
const VIEWS=['prehlad','faktury','cas','odberatelia','vydavky','kapela','nastavenia'];
const S={items:{},view:VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'prehlad',year:new Date().getFullYear(),invF:'all',evF:'upcoming',timeF:'month',mode:'start'};
let col=null;const Q={};
const DEF={kind:'settings',biz:{...IMPORT.biz},vatPayer:false,vatRate:23,rate:25,dueDays:14,prefix:'',desc:DESC,sign:'',logo:'',running:null,pin:''};
function settings(){const s=S.items.settings||{};const b={...DEF.biz};Object.entries(s.biz||{}).forEach(([k,v])=>{if(v)b[k]=v});
  if(!b.street&&b.address){const L=String(b.address).split('\n');b.street=L[0]||'';b.city=L[1]||''}
  return {...DEF,...s,biz:b}}
const list=k=>Object.entries(S.items).filter(([,v])=>v&&v.kind===k).map(([id,v])=>({...v,id}));
function save(id,data){const c=JSON.parse(JSON.stringify(data));delete c.id;if(c.kind==='event')bandSoon();S.items[id]=c;render();
  if(!col)return Promise.resolve();
  return Q[id]=(Q[id]||Promise.resolve()).then(()=>col.doc(id).set(c)).catch(e=>toast(e&&e.code==='quota_exceeded'?'Úložisko je plné. Zmaž staré záznamy.':'Uloženie zlyhalo. Skús to znova.'))}
function del(id){if(S.items[id]&&S.items[id].kind==='event')bandSoon();delete S.items[id];render();if(col)(Q[id]||Promise.resolve()).then(()=>col.doc(id).delete()).catch(()=>toast('Mazanie zlyhalo.'))}

async function init(){
  render();
  const to=setTimeout(()=>{$('#status').textContent='Dáta sa zatiaľ nenačítali…'},10000);
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id){clearTimeout(to);S.offline=true;$('#status').textContent='Bez ukladania';render();return}
    col=db.collection('data/users/'+id);
    col.onSnapshot(snap=>{const n={};snap.docs.forEach(d=>{if(d.exists)n[d.id]=d.data()});S.items=n;
      if(!snap.metadata.fromCache){clearTimeout(to);$('#status').textContent='Uložené v OneDrive';autoImport();setTimeout(autoMonthly,500);setTimeout(slimSign,1500)}render();refreshEditor()},
      ()=>{clearTimeout(to);$('#status').textContent='Spojenie sa prerušilo'});
  }catch(e){clearTimeout(to);S.offline=true;$('#status').textContent='Bez ukladania';render()}
}

// ===== úvod / zámok =====
async function pinHash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lnstatik:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function drawGate(){const now=new Date();const run=settings().running;const g=$('#gate');
  if(window.AUTH&&!AUTH.ok){g.innerHTML=AUTH.ready?AUTH.loginHTML():'<div class="gate"><p class="dim">Načítavam…</p></div>';return}const ask=S.gatePin;
  g.innerHTML=`<div class="gate"><div class="lg">${sig(15,'#8B929B','#1F2328')}</div>
   <div class="day">${now.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})}</div><div class="dt">${now.toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'long'})}</div>
   <button class="gb" onclick="S.gatePin=false;S.mode='time';render()"><span>Pracovňa${run?'<span class="dot" title="Stopky bežia"></span>':''}</span><span class="ar">›</span></button>
   ${ask?`<form class="pin" onsubmit="event.preventDefault();tryPin()"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN"><button class="btn p">Vstúpiť</button></form>`
   :`<button class="gb" onclick="enterFull()"><span>Admin</span><span class="ar">›</span></button>`}
   ${window.AUTH&&AUTH.ok?'<p style="margin-top:26px"><button class="btn q sm" onclick="AUTH.logout()">Odhlásiť sa</button></p>':''}
  </div>`;if(ask)setTimeout(()=>{const i=$('#pinIn');if(i)i.focus()},30)}
setInterval(()=>{if(S.mode==='start'&&!S.gatePin)drawGate()},30000);
function enterFull(){if(settings().pin){S.gatePin=true;drawGate();return}openFull();if(false){setTimeout(()=>modal(`<h2>Nastaviť PIN?</h2><p class="dim">Keď si appku otvoríš u niekoho iného, bez PIN-u sa do firmy nedostane. Odpracované hodiny ostanú bez PIN-u.</p>
   <div class="f"><label>Nový PIN (4 až 8 číslic)</label><input id="np" type="password" inputmode="numeric" autocomplete="new-password"></div>
   <div class="mfoot"><div></div><div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Neskôr</button><button class="btn p" onclick="setPin($('#np').value)">Uložiť PIN</button></div></div>`),300)}}
function openFull(){S.mode='full';S.gatePin=false;S.lastAct=Date.now();render();window.scrollTo(0,0)}
async function tryPin(){const v=($('#pinIn')||{}).value||'';if(await pinHash(v)===settings().pin)openFull();else{toast('Nesprávny PIN');const i=$('#pinIn');if(i){i.value='';i.focus()}}}
async function setPin(v){v=String(v||'').trim();if(v&&!/^\d{4,8}$/.test(v)){toast('PIN musí mať 4 až 8 číslic');return}
  await save('settings',{...settings(),pin:v?await pinHash(v):''});closeModal();toast(v?'PIN je nastavený':'PIN je zrušený')}
function lockApp(){closeModal();S.mode='start';S.firm=null;S.gatePin=false;render();window.scrollTo(0,0)}
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{S.lastAct=Date.now()},true));
setInterval(()=>{if(S.mode==='full'&&Date.now()-(S.lastAct||0)>15*60e3)lockApp()},30000);

// ===== nav =====
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)go(b.dataset.v)});
function go(v){S.view=v;try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(S.mode==='full'&&VIEWS.includes(v)){S.view=v;render()}});
function render(){
  document.body.classList.toggle('m-start',S.mode==='start');document.body.classList.toggle('m-time',S.mode==='time');
  if(S.mode==='start'){drawGate();return}
  if(S.mode==='time'){$('#main').innerHTML=`<div class="tbar">${sig(13,'#8B929B','#1F2328')}<button class="btn" onclick="lockApp()">Späť na úvod</button></div>`+(S.firm?vTime():vFirmPick());if(!S.firm)setTimeout(()=>{const i=$('#firmIn');if(i)i.focus()},30);return}
  drawBrand();
  document.querySelectorAll('#nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  const r=settings().running;
  $('#mini').innerHTML=r?`<div class="mini" onclick="go('cas')"><div class="c" id="miniClock">${dur(Date.now()-r.start)}</div><div class="s">${esc(r.client||'')}${r.note?' – '+esc(r.note):''}</div></div>`:'';
  const off=S.offline?`<div class="note">Dáta sa nepodarilo načítať z OneDrive. Skontroluj pripojenie a obnov stránku.</div>`:'';
  $('#main').innerHTML=off+({prehlad:vOverview,faktury:vInvoices,cas:vTime,odberatelia:vClients,vydavky:vExpenses,kapela:vBand,nastavenia:vSettings})[S.view]();
  if(S.view==='prehlad')bindChart();
}
setInterval(()=>{const r=settings().running;if(!r)return;const t=dur(Date.now()-r.start);const a=$('#miniClock');if(a)a.textContent=t;const b=$('#clock');if(b)b.textContent=t},1000);

// ===== helpers: invoices =====
const invTotal=i=>{const base=(i.items||[]).reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0);const vat=i.vatPayer?base*(+i.vatRate||0)/100:0;return {base,vat,total:Math.round((base+vat)*100)/100}};
const isOver=i=>i.status==='sent'&&i.dueDate<today();
function invTag(i){if(i.status==='paid')return '<span class="tag ok">Uhradená</span>';if(isOver(i))return '<span class="tag bad">Po splatnosti</span>';if(i.status==='sent')return '<span class="tag warn">Čaká na úhradu</span>';return '<span class="tag">Koncept</span>'}
function nextNumber(){const st=settings();const pre=(st.prefix||'')+new Date().getFullYear();
  const n=list('invoice').map(i=>String(i.number||'')).filter(x=>x.startsWith(pre)).map(x=>parseInt(x.slice(pre.length))||0);
  return pre+String((n.length?Math.max(...n):0)+1).padStart(3,'0')}
const yearsOf=()=>{const y=new Set([new Date().getFullYear()]);list('invoice').forEach(i=>i.issueDate&&y.add(+i.issueDate.slice(0,4)));list('event').forEach(e=>e.date&&y.add(+e.date.slice(0,4)));return [...y].sort()};
function yearSel(){return `<span class="yr"><button aria-label="Predošlý rok" onclick="S.year--;render()">‹</button><span style="min-width:56px;text-align:center">${S.year}</span><button aria-label="Ďalší rok" onclick="S.year++;render()">›</button></span>`}
const DEF_BAND=['Tomi','Laci','Marian','Daniel','Adam'];
function bandCfg(){const s=S.items.settings||{};return {members:(s.bandMembers&&s.bandMembers.length?s.bandMembers:DEF_BAND),me:s.bandMe||'Laci'}}
function splitOf(e){const c=bandCfg();const names=e.split&&Object.keys(e.split).length?Object.keys(e.split):c.members;const fee=+e.fee||0;
  const set=names.filter(n=>e.split&&e.split[n]&&e.split[n].base!==''&&e.split[n].base!==undefined);const fixed=set.reduce((s,n)=>s+(+e.split[n].base||0),0);
  const rest=names.length-set.length;const eq=rest?(fee-fixed)/rest:0;
  return names.map(n=>{const s=(e.split||{})[n]||{};const base=set.includes(n)?(+s.base||0):eq;let fuel=+s.fuel||0;if(!e.split&&n===c.me)fuel=+e.myFuel||0;return {name:n,base:Math.round(base*100)/100,fuel,total:Math.round((base+fuel)*100)/100}})}
const bandShare=e=>{const me=bandCfg().me;const r=splitOf(e).find(x=>x.name===me);return r?r.total:0};
const earned=e=>e.earned!==undefined&&e.earned!==''?+e.earned||0:(+e.fee?bandShare(e):0);

// ===== OVERVIEW =====
function vOverview(){
  const y=String(S.year);
  const inv=list('invoice').filter(i=>(i.issueDate||'').startsWith(y));
  const ev=list('event').filter(e=>(e.date||'').startsWith(y)&&e.status!=='cancel');
  const invoiced=inv.reduce((s,i)=>s+invTotal(i).total,0);
  const paid=inv.filter(i=>i.status==='paid').reduce((s,i)=>s+invTotal(i).total,0);
  const open=inv.filter(i=>i.status==='sent').reduce((s,i)=>s+invTotal(i).total,0);
  const bandE=ev.reduce((s,e)=>s+earned(e),0);
  const gigs=ev.filter(e=>e.type!=='Skúška');
  const t=today();
  const nextEv=list('event').filter(e=>e.date>=t&&e.status!=='cancel').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
  const unpaid=list('invoice').filter(i=>i.status==='sent').sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const hoursY=list('time').filter(e=>new Date(e.start).getFullYear()===S.year).reduce((s,e)=>s+(e.end-e.start),0);
  const empty=!list('invoice').length;const expY=list('expense').reduce((s,x)=>s+expInYear(x,S.year).total,0);
  return `<div class="head"><div><h1>Prehľad roka</h1><p class="lead">Koľko si fakturoval za statiku a koľko si zarobil s kapelou.</p></div>${yearSel()}</div>
  ${empty?importBox():''}${autoBox()}
  <div class="figs">
    <div class="fig"><div class="v">${eur0(invoiced)}</div><div class="k">Statika – fakturované (${inv.length})</div></div>
    <div class="fig"><div class="v">${eur0(paid)}</div><div class="k">Statika – uhradené</div></div>
    <div class="fig"><div class="v" style="${open?'color:var(--warn)':''}">${eur0(open)}</div><div class="k">Čaká na úhradu</div></div>
    <div class="fig"><div class="v">${eur0(bandE)}</div><div class="k">Kapela – môj podiel (${gigs.length} akcií)</div></div>
    <div class="fig"><div class="v" style="${expY?'color:var(--bad)':''}">${expY?'−'+eur0(expY):eur0(0)}</div><div class="k">Výdavky</div></div>
    <div class="fig total"><div class="v">${eur0(paid+bandE-expY)}</div><div class="k">Zostane po výdavkoch</div></div>
  </div>
  <div class="panel" style="margin-bottom:22px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><h3>Príjmy po mesiacoch, ${y}</h3><span class="dim" style="font-size:13px">Odpracované hodiny za rok: ${fh(hoursY)}</span></div>
    <div class="legend"><span><i style="background:var(--stat)"></i>Statika (fakturované)</span><span><i style="background:var(--band)"></i>Kapela (zarobené)</span></div>
    <div class="chart" id="chart">${chartSVG(inv,ev)}<div class="tip" id="tip"></div></div>
  </div>
  <div class="cols">
    <div class="panel"><h3>Najbližšie akcie kapely</h3>${nextEv.length?nextEv.map(e=>`<div class="ev" onclick="editEvent('${e.id}')" style="grid-template-columns:56px 1fr auto">${dateBox(e.date)}<div><div class="t">${esc(e.title||e.type)}</div><div class="m">${esc([e.time,e.venue,e.city].filter(Boolean).join(', '))}</div></div><div class="b">${+e.fee?eur0(e.fee):''}</div></div>`).join(''):'<div class="empty"><p>Žiadne naplánované akcie.</p><button class="btn" onclick="editEvent()">Pridať akciu</button></div>'}</div>
    <div class="panel"><h3>Neuhradené faktúry</h3>${unpaid.length?`<table><tbody>${unpaid.map(i=>`<tr class="click" onclick="openInvoice('${i.id}')"><td class="b">${esc(i.number)}</td><td>${esc((i.client||{}).name)}</td><td>${isOver(i)?`<span class="tag bad">${fd(i.dueDate)}</span>`:fd(i.dueDate)}</td><td class="r b">${eur(invTotal(i).total)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty"><p>Všetko je uhradené.</p></div>'}</div>
  </div>`;
}
function chartSVG(inv,ev){
  const A=Array(12).fill(0),B=Array(12).fill(0);
  inv.forEach(i=>A[+i.issueDate.slice(5,7)-1]+=invTotal(i).total);
  ev.forEach(e=>B[+e.date.slice(5,7)-1]+=earned(e));
  S.chartData={A,B};
  const W=900,H=260,L=56,R=8,T=10,Bm=28,ih=H-T-Bm,iw=W-L-R;
  const mx=Math.max(100,...A,...B);const step=[100,200,250,500,1000,2000,2500,5000,10000].find(s=>mx/s<=5)||Math.ceil(mx/5);
  const top=Math.ceil(mx/step)*step;const yy=v=>T+ih-(v/top)*ih;
  const gw=iw/12,bw=Math.min(22,(gw-14)/2);
  let g='';for(let v=0;v<=top;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${yy(v)}" y2="${yy(v)}" stroke="${v?'#ECEEEF':'#C9CDD2'}"/><text x="${L-8}" y="${yy(v)+4}" text-anchor="end" font-size="12" fill="#868D96">${v.toLocaleString('sk-SK')}</text>`}
  const bar=(x,v,c)=>{if(!v)return'';const h=Math.max(2,(v/top)*ih),y=T+ih-h,r=Math.min(4,h/2);return `<path d="M${x} ${T+ih} V${y+r} Q${x} ${y} ${x+r} ${y} H${x+bw-r} Q${x+bw} ${y} ${x+bw} ${y+r} V${T+ih} Z" fill="${c}"/>`};
  let b='';for(let m=0;m<12;m++){const cx=L+gw*m+gw/2;
    b+=bar(cx-bw-1,A[m],'#1F6FB0')+bar(cx+1,B[m],'#C2872B');
    b+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="#868D96">${MON[m]}</text><rect class="hit" data-m="${m}" x="${L+gw*m}" y="${T}" width="${gw}" height="${ih}" fill="transparent"/>`}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Príjmy po mesiacoch">${g}${b}</svg>`;
}
function bindChart(){const c=$('#chart');if(!c)return;const tip=$('#tip');
  c.querySelectorAll('.hit').forEach(h=>{h.addEventListener('mouseenter',()=>{const m=+h.dataset.m,{A,B}=S.chartData;
    const svg=c.querySelector('svg'),sr=svg.getBoundingClientRect(),hr=h.getBoundingClientRect(),cr=c.getBoundingClientRect();
    tip.innerHTML=`<b>${MON[m]} ${S.year}</b><br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#1F6FB0;margin-right:6px"></i>Statika ${eur(A[m])}<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#C2872B;margin-right:6px"></i>Kapela ${eur(B[m])}`;
    tip.style.display='block';tip.style.left=(hr.left-cr.left+hr.width/2)+'px';tip.style.top=(hr.top-cr.top+20)+'px';h.setAttribute('fill','rgba(31,35,40,.04)')});
    h.addEventListener('mouseleave',()=>{tip.style.display='none';h.setAttribute('fill','transparent')})})}
function importBox(){if(!IMPORT.invoices.length)return '';return `<div class="panel" style="margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div><b>Prenes si dáta z Excelu</b><div class="dim" style="font-size:14px"></div></div><button class="btn p" onclick="runImport(this)">Načítať dáta z Excelu</button></div>`}
let autoDone=false;
let signDone=false;
async function slimSign(){if(signDone)return;signDone=true;const s=S.items.settings;if(!s||!s.sign||s.sign.length<15000||!/^data:image/.test(s.sign))return;
  try{const img=new Image();await new Promise((ok,er)=>{img.onload=ok;img.onerror=er;img.src=s.sign});const k=Math.min(1,600/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);const w=c.toDataURL('image/webp',0.8);if(w.startsWith('data:image/webp')&&w.length<s.sign.length*0.7)save('settings',{...S.items.settings,sign:w})}catch(e){}}
function autoImport(){if(autoDone||!IMPORT.invoices.length)return;autoDone=true;const s=S.items.settings||{};if(s.sign===SIGN)save('settings',{...s,sign:''});if(s.imported)return;runImport(null)}
function runImport(btn){
  if(btn)btn.disabled=true;const st=settings();
  save('settings',{...st,sign:st.sign===SIGN?'':(st.sign||''),desc:st.desc||DESC,imported:true});
  IMPORT.clients.forEach(c=>{const{key,...d}=c;if(!S.items[key])save(key,{kind:'client',...d})});
  const have=new Set(list('invoice').map(i=>i.number));
  IMPORT.invoices.forEach(([no,ck,iss,sup,due,note,price])=>{if(have.has(no))return;const c=IMPORT.clients.find(x=>x.key===ck);const{key,...cd}=c;
    save('inv_'+no,{kind:'invoice',number:no,vs:no,clientId:ck,client:cd,issueDate:iss,supplyDate:sup,dueDate:due,note,items:[{desc:DESC,qty:1,unit:'ks',price}],status:'paid',vatPayer:false,vatRate:23,src:{}})});
  toast('Faktúry z Excelu sú načítané');
}
function dateBox(d){const x=new Date(d+'T12:00');return `<div class="d"><b>${x.getDate()}</b><span>${MON[x.getMonth()]} ${String(x.getFullYear()).slice(2)}</span></div>`}

// ===== INVOICES list =====

    ${shown.length?`<table><thead><tr><th>Číslo</th><th>Odberateľ</th><th>Poznámka</th><th>Vystavená</th><th>Splatnosť</th><th>Stav</th><th class="r">Suma</th></tr></thead><tbody>
    ${shown.map(i=>`<tr class="click" onclick="openInvoice('${i.id}')"><td class="b">${esc(i.number)}</td><td>${esc((i.client||{}).name||'—')}</td><td class="dim">${esc(i.note||'')}</td><td>${fd(i.issueDate)}</td><td>${fd(i.dueDate)}</td><td>${invTag(i)}</td><td class="r b">${eur(invTotal(i).total)}</td></tr>`).join('')}</tbody></table>`

  </div>`;
}

// ===== INVOICE editor =====
let ED=null;
function blankInvoice(extra={}){const st=settings();const t=today();const no=nextNumber();

const GH_REPO='LN-Statik/lnstatik',GH_PATH='kalendar/index.html';
let bandT=null;function bandSoon(){if(!(settings().ghToken))return;clearTimeout(bandT);bandT=setTimeout(()=>publishBand(false),60000)}
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function publishBand(manual){const st=settings();const tok=st.ghToken;const msg=t=>{const e=$('#bandSt');if(e)e.textContent=t;if(manual)toast(t)};
  if(!tok){msg('Najprv vlož GitHub kľúč a ulož nastavenia');return}
  try{msg('Aktualizujem SB Kalendár…');
    const F=['date','time','title','type','venue','city','fee','fuel','members','status','notes','contact','contactEmail','deposit','depositBy','depositPaid','split'];
    const evs=list('event').map(e=>{const o={id:e.id,files:[]};F.forEach(k=>o[k]=e[k]??'');return o}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const now=new Date();const payload=JSON.stringify({members:bandCfg().members,events:evs,updated:now.toLocaleDateString('sk-SK')+' '+now.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})});
    const r0=await fetch('https://app.lnstatik.sk/kalendar/sablona.html',{cache:'no-store'}).catch(()=>null);const tpl=r0&&r0.ok?await r0.text():await (await fetch(`https://raw.githubusercontent.com/${GH_REPO}/main/kalendar/sablona.html`,{cache:'no-store'})).text();
    if(!tpl.includes('/*__BLOB__*/null'))throw new Error('šablóna');
    const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),N=250000;
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode((st.bandUser||'simple').trim().toLowerCase()+':'+(st.bandPw||'0000SB')),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:N,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(payload)));
    const html=tpl.replace('/*__BLOB__*/null',JSON.stringify({s:u8b64(salt),i:u8b64(iv),c:u8b64(ct),n:N}));
    const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};const url=`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`;
    const cur=await fetch(url+'?ref=main',{headers:H,cache:'no-store'});const sha=cur.ok?(await cur.json()).sha:undefined;
    const r=await fetch(url,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'Aktualizácia SB Kalendára',content:u8b64(new TextEncoder().encode(html)),sha,branch:'main'})});
    if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(r.status===401?'neplatný GitHub kľúč':m||('GitHub '+r.status))}
    const s2=S.items.settings||{};const c=JSON.parse(JSON.stringify({...s2,bandAt:Date.now()}));S.items.settings=c;if(col)col.doc('settings').set(c);
    msg('SB Kalendár je aktualizovaný (zmena sa prejaví do 1–2 minút)')}
  catch(e){console.error(e);msg('SB Kalendár sa nepodarilo aktualizovať: '+(e.message||e))}}

const lastDay=(y,m)=>new Date(y,m,0).getDate();
const ymOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
let autoRan=false;
function autoMonthly(){if(autoRan)return;autoRan=true;const st=settings();const now=new Date();const made=[];
  const dueM=[];{let y=now.getFullYear(),m=now.getMonth()+1;if(now.getDate()<lastDay(y,m)){m--;if(!m){m=12;y--}}for(let k=0;k<3;k++){dueM.push(`${y}-${pad(m)}`);m--;if(!m){m=12;y--}}}
  list('client').filter(c=>c.autoInv).forEach(c=>{const k=fkey(c.name);
    dueM.slice().reverse().forEach(ym=>{if(c.autoFrom&&ym<c.autoFrom)return;
      if(list('invoice').some(i=>i.src&&i.src.auto===c.id+':'+ym))return;
      const ents=list('time').filter(e=>!e.invoiceId&&fkey(e.client||e.project)===k&&ymOf(new Date(e.start))===ym).sort((a,b)=>a.start-b.start);
      if(!ents.length)return;const ms=ents.reduce((s,e)=>s+(e.end-e.start),0);const q=Math.round(hrs(ms)*100)/100;
      const [yy,mm]=ym.split('-').map(Number);const no=nextNumber();const iss=today();const{kind,id:cid,autoInv,autoRate,autoDesc,autoFrom,...cd}=c;
      const inv={kind:'invoice',number:no,vs:no,clientId:c.id,client:cd,issueDate:iss,supplyDate:`${ym}-${pad(lastDay(yy,mm))}`,dueDate:addDays(iss,+st.dueDays||14),
        note:`za obdobie ${pad(mm)}/${yy}`,items:[{desc:c.autoDesc||st.desc||DESC,qty:q,unit:'h',price:+(c.autoRate||st.rate)||0}],status:'draft',vatPayer:!!st.vatPayer,vatRate:st.vatRate,src:{times:ents.map(e=>e.id),auto:c.id+':'+ym}};
      const iid='inv_'+no;save(iid,inv);ents.forEach(e=>save(e.id,{...S.items[e.id],invoiceId:iid}));made.push(iid)})});
  if(made.length)S.autoMade=made}

async function shrinkImg(file){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((ok,er)=>{img.onload=ok;img.onerror=er;img.src=url});
  const s=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.78))}finally{URL.revokeObjectURL(url)}}

  <form id="sf"><div class="cols">
   <div class="panel"><h3>Firma</h3>
    <div class="f"><label>Obchodné meno</label><input name="name" value="${esc(b.name)}"></div>
    <div class="fr"><div class="f"><label>Ulica</label><input name="street" value="${esc(b.street)}"></div><div class="f"><label>PSČ a mesto</label><input name="city" value="${esc(b.city)}"></div></div>
    <div class="f"><label>Krajina</label><input name="country" value="${esc(b.country)}"></div>
    <div class="fr"><div class="f"><label>IČO</label><input name="ico" value="${esc(b.ico)}"></div><div class="f"><label>DIČ</label><input name="dic" value="${esc(b.dic)}"></div><div class="f"><label>IČ DPH</label><input name="icdph" value="${esc(b.icdph)}"></div></div>
    <div class="f"><label>Text v pätičke</label><textarea name="reg">${esc(b.reg)}</textarea></div>
   </div>
   <div class="panel"><h3>Platby a kontakt</h3>
    <div class="f"><label>IBAN</label><input name="iban" value="${esc(b.iban)}"></div>
    <div class="f"><label>SWIFT</label><input name="swift" value="${esc(b.swift)}"></div>
    <div class="fr"><div class="f"><label>Kontaktná osoba</label><input name="contact" value="${esc(b.contact)}"></div><div class="f"><label>Telefón</label><input name="phone" value="${esc(b.phone)}"></div></div>
    <div class="f"><label>E-mail</label><input name="email" value="${esc(b.email)}"></div>
   </div>
   <div class="panel"><h3>Faktúry</h3>
    <div class="f"><label>Predvolený popis položky</label><input name="desc" value="${esc(st.desc)}"></div>
    <div class="fr"><div class="f"><label>Splatnosť (dni)</label><input type="number" name="dueDays" value="${esc(st.dueDays)}"></div><div class="f"><label>Predpona čísla</label><input name="prefix" value="${esc(st.prefix)}" placeholder="bez predpony"></div><div class="f"><label>Hodinová sadzba €</label><input type="number" step="0.01" name="rate" value="${esc(st.rate)}"></div></div>
    <label class="chk" style="margin-bottom:10px"><input type="checkbox" name="vatPayer" ${st.vatPayer?'checked':''}> Som platiteľ DPH</label>
    <div class="fr"><div class="f"><label>Sadzba DPH %</label><input type="number" name="vatRate" value="${esc(st.vatRate)}"></div></div>
   </div>
   <div class="panel"><h3>Súkromie</h3>
    <p class="dim" style="margin-top:0">Appka sa otvorí na úvodnej stránke. Do firmy sa vstupuje PIN-om, odpracované hodiny sú bez PIN-u. Po 15 minútach nečinnosti sa appka sama zamkne.</p>
    <div class="fr"><div class="f"><label>Nový PIN (prázdne = bez PIN-u)</label><input id="newPin" type="password" inputmode="numeric" autocomplete="new-password"></div><div class="f" style="align-self:end"><button type="button" class="btn" onclick="setPin($('#newPin').value)">Zmeniť PIN</button></div></div>
   </div>
   <div class="panel"><h3>Kapela</h3>
    <div class="f"><label>Členovia kapely (oddelení čiarkou)</label><input name="bandMembers" value="${esc(bandCfg().members.join(', '))}"></div>
    <div class="f"><label>Ja som</label><input name="bandMe" value="${esc(bandCfg().me)}"></div>
    <div style="border-top:1px solid var(--line2);margin-top:8px;padding-top:12px"><b>SB Kalendár</b> <span class="dim" style="font-size:13px">– app.lnstatik.sk/kalendar</span>
     <div class="dim" style="font-size:13px;margin:4px 0 10px">Stránka sa aktualizuje sama asi minútu po každej zmene akcie. Potrebuje prístupový kľúč z GitHubu.</div>
     <div class="fr"><div class="f"><label>Meno na stránke</label><input name="bandUser" value="${esc(st.bandUser||'simple')}"></div><div class="f"><label>Heslo na stránke</label><input name="bandPw" value="${esc(st.bandPw||'0000SB')}"></div></div>
     <div class="f"><label>GitHub kľúč ${st.ghToken?'<span class="tag ok">nastavený</span>':''}</label><input name="ghToken" type="password" placeholder="${st.ghToken?'ponechať':'github_pat_…'}" autocomplete="off"></div>
     <button type="button" class="btn sm" onclick="publishBand(true)">Aktualizovať SB Kalendár teraz</button> <span class="dim" id="bandSt" style="font-size:13px">${st.bandAt?'Naposledy '+new Date(st.bandAt).toLocaleString('sk-SK'):''}</span></div>
   </div>
   <div class="panel"><h3>Šablóna e-mailu</h3>
    <div class="f"><label>Predmet</label><input name="mailSubj" value="${esc(st.mailSubj||DEF_SUBJ)}"></div>
    <div class="f"><label>Text</label><textarea name="mailBody" style="min-height:200px">${esc(isDefBody(st.mailBody)?DEF_BODY:st.mailBody)}</textarea></div>
    <div class="dim" style="font-size:12.5px;line-height:1.6">Môžeš použiť: {cislo} {suma} {splatnost} {vs} {iban} {odberatel} {obdobie} {meno} {telefon} {firma}. Pod text sa automaticky pridá podpis s logom LN · STATIK, menom, telefónom a e-mailom.</div>
   </div>
   <div class="panel"><h3>Záloha</h3>
    <p class="dim" style="margin:0 0 12px;font-size:14px">Automatická záloha sa ukladá na OneDrive do priečinka <b>2_Financie\LNStatik_zaloha</b>: Excel so všetkými dátami, každá faktúra v PDF a súbor na obnovenie.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn" onclick="exportBackup(this)">Stiahnuť zálohu teraz</button>
    <label class="btn" style="margin:0;cursor:pointer">Obnoviť zo zálohy…<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label></div>
   </div>
   <div class="panel"><h3>Logo a podpis</h3>
    <div class="f"><label>Logo na faktúre</label><div style="display:inline-flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 26px;margin-bottom:6px">${sig(16,'#8B929B','#1F2328')}</div></div>
    <div class="f"><label>Vlastné logo namiesto tohto (voliteľné)</label>${st.logo?`<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><img src="${esc(st.logo)}" style="max-height:40px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px"><button type="button" class="btn sm" onclick="setImg('logo','')">Použiť logo LNStatik</button></div>`:''}<input type="file" accept="image/*" onchange="pickImg(this,'logo')"></div>
    <div class="f"><label>Podpis</label><div style="background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;display:inline-block;margin-bottom:8px;min-width:160px;min-height:50px">${st.sign!=='none'?`<img src="${esc(st.sign||SIGN)}" style="max-height:60px;display:block">`:'<span class="dim">bez podpisu</span>'}</div><div style="display:flex;gap:8px;align-items:center"><input type="file" accept="image/*" onchange="pickImg(this,'sign')">${st.sign!=='none'?'<button type="button" class="btn sm" onclick="setImg(\'sign\',\'none\')">Odstrániť</button>':''}</div></div>
   </div>
  </div><div style="margin-top:18px"><button class="btn p">Uložiť nastavenia</button></div></form>`}
document.addEventListener('submit',e=>{if(e.target.id!=='sf')return;e.preventDefault();const f=new FormData(e.target);const st=settings();const biz={};
  ['name','street','city','country','ico','dic','icdph','iban','swift','contact','phone','email','reg'].forEach(k=>biz[k]=(f.get(k)||'').trim());
  save('settings',{...st,biz,bandUser:(f.get('bandUser')||'simple').trim(),bandPw:f.get('bandPw')||'0000SB',ghToken:(f.get('ghToken')||'').trim()||st.ghToken||'',bandMembers:(f.get('bandMembers')||'').split(',').map(x=>x.trim()).filter(Boolean),bandMe:(f.get('bandMe')||'Laci').trim(),mailSubj:f.get('mailSubj')||DEF_SUBJ,mailBody:f.get('mailBody')||DEF_BODY,desc:f.get('desc')||DESC,dueDays:+f.get('dueDays')||14,prefix:(f.get('prefix')||'').trim(),rate:+f.get('rate')||0,vatPayer:!!f.get('vatPayer'),vatRate:+f.get('vatRate')||0});toast('Nastavenia sú uložené')});
function setImg(k,v){save('settings',{...settings(),[k]:v})}
async function exportBackup(btn){const data={app:'LNStatik',verzia:1,vytvorene:new Date().toISOString(),items:S.items};
  try{const dl=await claude.use('downloads');if(!dl){toast('Sťahovanie tu nie je dostupné.');return}
    await dl.save({filename:`LNStatik_zaloha_${today()}.json`,data:JSON.stringify(data,null,1)});toast('Záloha je stiahnutá')}catch(e){if(!(e&&e.code==='declined'))toast('Zálohu sa nepodarilo stiahnuť')}}
function importBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast('Súbor nie je platná záloha LNStatik');return}
  let items=d&&d.items&&typeof d.items==='object'?d.items:d;if(Array.isArray(items))items=Object.fromEntries(items.map(x=>[x.id,x.data||x]));
  const ids=Object.keys(items||{}).filter(k=>items[k]&&items[k].kind);if(!ids.length){toast('V súbore nie sú žiadne dáta LNStatik');return}
  const n={invoice:0,client:0,time:0,event:0};ids.forEach(k=>{if(n[items[k].kind]!==undefined)n[items[k].kind]++});
  modal(`<h2>Obnoviť zo zálohy</h2><p>Zo súboru sa obnoví: <b>${n.invoice}</b> faktúr, <b>${n.client}</b> odberateľov, <b>${n.time}</b> záznamov času, <b>${n.event}</b> akcií a tvoje nastavenia.</p><p class="dim">Záznamy s rovnakým označením sa prepíšu verziou zo zálohy. Ostatné tvoje dáta ostanú.</p><div class="mfoot"><span></span><div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Zrušiť</button><button class="btn p" id="doRestore">Obnoviť</button></div></div>`);
  $('#doRestore').onclick=()=>{ids.forEach(k=>{const v={...items[k]};if(k==='settings')v.running=null;save(k,v)});closeModal();toast('Dáta zo zálohy sú obnovené')}};r.readAsText(f);inp.value=''}
function pickImg(inp,k){const file=inp.files[0];if(!file)return;const img=new Image();const r=new FileReader();
  r.onload=()=>{img.onload=()=>{const max=k==='logo'?600:500;const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);setImg(k,c.toDataURL('image/png'));toast('Obrázok je nahratý')};img.src=r.result};r.readAsDataURL(file)}

// ===== modal =====
function modal(h){const d=document.createElement('div');d.id='mroot';d.innerHTML=`<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">${h}</div></div>`;closeModal();document.body.appendChild(d);
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});const i=d.querySelector('input:not([readonly]),select');if(i)setTimeout(()=>i.focus(),30)}
function closeModal(){const m=$('#mroot');if(m)m.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#mroot'))closeModal();else if(ED)closeEditor()}});

init();
</script>
</body>
</html>
