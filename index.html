<script>/* LNStatik – úložisko v OneDrive (Microsoft Graph) namiesto claude.ai.
   Poskytuje rovnaké rozhranie ako claude.use('db'|'user'|'downloads'|'assets'). */
(function(){
const CFG=window.LNS_CONFIG||{};
const SCOPES=['User.Read','Files.ReadWrite'];
const GRAPH='https://graph.microsoft.com/v1.0';
const BASES=['Dokumenty/1-- LNStatik/4_LNStatik/2_Financie','Documents/1-- LNStatik/4_LNStatik/2_Financie','1-- LNStatik/4_LNStatik/2_Financie'];
const DATA_DIR='LNStatik_data',DATA_FILE='lnstatik_data.json',ATT_DIR='Prilohy';
const enc=p=>p.split('/').map(encodeURIComponent).join('/');

let msal=null,account=null;
const AUTH={ok:false,ready:false,err:'',user:''};
// Zapamätané prihlásenie len pre majiteľa (účet z tenantu LN-Statik); ostatní sa prihlasujú pri každom otvorení.
const REM=(()=>{try{let r=localStorage.getItem('lns_remember');if(r===null){r=Object.keys(localStorage).some(k=>k.includes(CFG.clientId||'~'))?'1':'0';localStorage.setItem('lns_remember',r)}return r==='1'}catch(e){return false}})();
const isOwner=a=>!!(a&&CFG.tenantId&&String(a.homeAccountId||'').toLowerCase().endsWith('.'+String(CFG.tenantId).toLowerCase()));
AUTH.remember=REM;
window.AUTH=AUTH;

AUTH.loginHTML=function(){
  if(!CFG.clientId)return `<div class="gate"><div class="lg">${(typeof sig!=='undefined'?sig(15,'#8B929B','#1F2328'):'')}</div><p class="dim">Appka ešte nie je prepojená s Microsoft 365 (chýba Client ID v config.js).</p></div>`;
  return `<div class="gate"><div class="lg">${(typeof sig!=='undefined'?sig(15,'#8B929B','#1F2328'):'')}</div>
   <div class="day" style="font-size:26px">Prihlásenie</div><div class="dt" style="text-transform:none">Dáta sú uložené v tvojom OneDrive.</div>
   ${AUTH.err?`<p style="color:var(--bad);font-size:14px">${AUTH.err}</p>`:''}
   <button class="gb" onclick="AUTH.login()"><span>Prihlásiť sa cez Microsoft<small>Konto LN-Statika</small></span><span class="ar">›</span></button>
   <a class="gb" href="/kalendar/" style="text-decoration:none;color:inherit"><span>SB Kalendár<small>Kapela – akcie a dovolenky</small></span><span class="ar">›</span></a></div>`};
AUTH.login=()=>msal.loginRedirect({scopes:SCOPES,prompt:REM?'select_account':'login'});
AUTH.logout=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('msal.')||k.includes(CFG.clientId)).forEach(k=>localStorage.removeItem(k));sessionStorage.clear()}catch(e){}msal.logoutRedirect({account})};

async function token(sc){sc=sc||SCOPES;
  try{return (await msal.acquireTokenSilent({scopes:sc,account})).accessToken}
  catch(e){if(sc!==SCOPES){try{sessionStorage.setItem('lns_after_consent','1')}catch(x){}await msal.acquireTokenRedirect({scopes:sc,account});const er=new Error('Presmerovanie na povolenie Outlooku');er.redirect=true;throw er}await msal.acquireTokenRedirect({scopes:sc,account});throw e}}
async function g(path,opt={}){
  const t=await token();
  return fetch(path.startsWith('http')?path:GRAPH+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}})}

// ---------- dáta ----------
let lastSnap=null,base=null,state={items:{},u:{},del:{}},etag=null,dirty={},listeners=[],saving=null,timer=null,loaded=false;
const FILE=()=>`/me/drive/root:/${enc(base+'/'+DATA_DIR+'/'+DATA_FILE)}`;
async function findBase(){
  if(CFG.basePath){base=CFG.basePath;return}
  for(const b of BASES){const r=await g(`/me/drive/root:/${enc(b)}?$select=id`);if(r.ok){base=b;return}}
  base='LNStatik';}
function emit(fromCache){const docs=Object.entries(state.items).map(([id,d])=>({id,exists:true,data:()=>JSON.parse(JSON.stringify(d))}));
  listeners.forEach(f=>{try{f({docs,metadata:{fromCache:!!fromCache}})}catch(e){console.error(e)}})}
async function pull(){
  const m=await g(FILE()+'?$select=eTag,id');
  if(m.status===404){etag=null;return {items:{},u:{},del:{}}}
  if(!m.ok)throw new Error('read '+m.status);
  const meta=await m.json();const c=await g(FILE()+':/content');if(!c.ok)throw new Error('read '+c.status);
  const j=await c.json();etag=meta.eTag;return {items:j.items||{},u:j.u||{},del:j.del||{}}}
function merge(remote){
  const out={items:{...remote.items},u:{...remote.u},del:{...remote.del}};
  for(const [id,ts] of Object.entries(dirty)){
    const rts=Math.max(remote.u[id]||0,remote.del[id]||0);if(rts>ts)continue;
    if(state.items[id]!==undefined){out.items[id]=state.items[id];out.u[id]=ts;delete out.del[id]}
    else{delete out.items[id];delete out.u[id];out.del[id]=ts}}
  state=out}
async function push(){
  const body=JSON.stringify({app:'LNStatik',verzia:1,ulozene:new Date().toISOString(),items:state.items,u:state.u,del:state.del});
  const sent={...dirty};
  const r=await g(FILE()+':/content',{method:'PUT',headers:{'Content-Type':'application/json',...(etag?{'If-Match':etag}:{})},body});
  if(r.status===412||r.status===409){merge(await pull());emit(false);return push()}
  if(!r.ok)throw new Error('write '+r.status);
  etag=(await r.json()).eTag;
  try{const d=new Date().toISOString().slice(0,10);if(lastSnap!==d){lastSnap=d;snapshot(d,body)}}catch(e){console.warn('snapshot',e)}
  for(const [id,ts] of Object.entries(sent))if(dirty[id]===ts)delete dirty[id]}
function schedule(){clearTimeout(timer);setStatus('Ukladám…');timer=setTimeout(flush,800)}
async function flush(){if(saving)return saving;
  saving=(async()=>{try{while(Object.keys(dirty).length)await push();setStatus('Uložené v OneDrive')}
    catch(e){console.error(e);setStatus('Neuložené – skúsim znova');clearTimeout(timer);timer=setTimeout(flush,8000)}
    finally{saving=null}})();return saving}
function setStatus(t){const s=document.getElementById('status');if(s)s.textContent=t}
async function poll(){if(!loaded||document.hidden||Object.keys(dirty).length||saving)return;
  try{const m=await g(FILE()+'?$select=eTag');if(!m.ok)return;const e=(await m.json()).eTag;if(e!==etag){state=await pull();emit(false)}}catch(e){}}
setInterval(poll,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
window.addEventListener('beforeunload',e=>{if(Object.keys(dirty).length){flush();e.preventDefault();e.returnValue=''}});

const col={doc:id=>({
    set:async d=>{state.items[id]=JSON.parse(JSON.stringify(d));state.u[id]=Date.now();delete state.del[id];dirty[id]=state.u[id];schedule()},
    delete:async()=>{delete state.items[id];delete state.u[id];state.del[id]=Date.now();dirty[id]=state.del[id];schedule()}}),
  onSnapshot:(f,err)=>{listeners.push(f);ready.then(()=>emit(false)).catch(e=>err&&err(e));return()=>{listeners=listeners.filter(x=>x!==f)}}};

// denná záloha: gzip, ponechá 7 posledných dní + 1 za každý mesiac (12 mesiacov)
async function snapshot(d,body){const dir=base+'/'+DATA_DIR+'/zalohy';let blob=new Blob([body],{type:'application/json'}),ext='.json';
  if(window.CompressionStream){blob=await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();ext='.json.gz'}
  await g(`/me/drive/root:/${enc(dir+'/lnstatik_data_'+d+ext)}:/content`,{method:'PUT',headers:{'Content-Type':'application/octet-stream'},body:blob});
  const r=await g(`/me/drive/root:/${enc(dir)}:/children?$select=id,name&$top=500`);if(!r.ok)return;const files=((await r.json()).value||[]).map(f=>({...f,d:(f.name.match(/(\d{4}-\d{2}-\d{2})/)||[])[1]})).filter(f=>f.d).sort((a,b)=>b.d.localeCompare(a.d));
  const keep=new Set();files.slice(0,7).forEach(f=>keep.add(f.id));const months={};files.forEach(f=>{const m=f.d.slice(0,7);if(!months[m])months[m]=f});Object.values(months).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,12).forEach(f=>keep.add(f.id));
  for(const f of files)if(!keep.has(f.id))await g(`/me/drive/items/${encodeURIComponent(f.id)}`,{method:'DELETE'})}

// ---------- prílohy ----------
async function attFolder(){return base+'/'+DATA_DIR+'/'+ATT_DIR}
const assets={
  upload:async(file,{type}={})=>{const name=Date.now().toString(36)+'_'+(file.name||'priloha').replace(/[\\/:*?"<>|#%]/g,'_');
    const path=`/me/drive/root:/${enc((await attFolder())+'/'+name)}`;let item;
    if(file.size<=4*1024*1024){const r=await g(path+':/content',{method:'PUT',headers:{'Content-Type':type||file.type||'application/octet-stream'},body:file});if(!r.ok)throw new Error('upload '+r.status);item=await r.json()}
    else{const s=await g(path+':/createUploadSession',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const {uploadUrl}=await s.json();
      const CH=5*327680;for(let o=0;o<file.size;o+=CH){const part=file.slice(o,o+CH);const r=await fetch(uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${o}-${o+part.size-1}/${file.size}`},body:part});if(!r.ok)throw new Error('upload '+r.status);if(r.status===200||r.status===201)item=await r.json()}}
    return {id:item.id,contentType:(item.file&&item.file.mimeType)||type||file.type,sizeBytes:item.size}},
  delete:async id=>{await g(`/me/drive/items/${encodeURIComponent(id)}`,{method:'DELETE'})}};
async function openAtt(id){const w=window.open('about:blank','_blank');
  try{const r=await g(`/me/drive/items/${encodeURIComponent(id)}?$select=@microsoft.graph.downloadUrl,webUrl,file`);const j=await r.json();
    const u=j['@microsoft.graph.downloadUrl']||j.webUrl;if(w)w.location=u;else location.href=u}catch(e){if(w)w.close();alert('Prílohu sa nepodarilo otvoriť.')}}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="/_blob/"]');if(!a)return;e.preventDefault();e.stopPropagation();openAtt(decodeURIComponent(a.getAttribute('href').slice(7)))},true);

// ---------- kalendár v Outlooku (záloha akcií kapely) ----------
AUTH.calSync=async(evs,map,calName)=>{const t=await token(['Calendars.ReadWrite']);const H={Authorization:'Bearer '+t,'Content-Type':'application/json'};
  const q=async(path,o={})=>{const r=await fetch(GRAPH+path,{...o,headers:{...H,...(o.headers||{})}});if(!r.ok&&r.status!==404){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(m||('Outlook '+r.status))}return r};
  let cal=(await (await q(`/me/calendars?$select=id,name&$top=100`)).json()).value.find(c=>c.name===calName);
  if(!cal)cal=await (await q('/me/calendars',{method:'POST',body:JSON.stringify({name:calName})})).json();
  const out={};
  for(const e of evs){const body=JSON.stringify(e.ev);let id=map[e.id];
    if(id){const r=await q(`/me/calendars/${cal.id}/events/${encodeURIComponent(id)}`,{method:'PATCH',body});if(r.status===404)id=null}
    if(!id){const r=await q(`/me/calendars/${cal.id}/events`,{method:'POST',body});id=(await r.json()).id}
    out[e.id]=id}
  for(const [k,id] of Object.entries(map))if(!out[k])await q(`/me/calendars/${cal.id}/events/${encodeURIComponent(id)}`,{method:'DELETE'});
  return out};

// ---------- PDF faktúr do OneDrive ----------
AUTH.savePdf=async(inv,blob)=>{if(!base)return;const y=String(inv.issueDate||'').slice(0,4)||'bez_roku';const n=String(inv.number||'faktura').replace(/[^\w-]/g,'');
  try{await g(`/me/drive/root:/${enc(base+'/LNStatik_zaloha/Faktury_PDF/'+y+'/Faktura_'+n+'.pdf')}:/content`,{method:'PUT',headers:{'Content-Type':'application/pdf'},body:blob})}catch(e){console.warn('pdf',e)}};


// ---------- súbory projektov ----------
const proot=()=>base.replace(/\/4_LNStatik\/2_Financie$/,'');const rel=p=>proot()+'/'+String(p).replace(/^\/+/,'');
AUTH.fsOk=()=>!!base;
AUTH.mkdir=async(path)=>{const parts=String(path).split('/').filter(Boolean);let cur=proot();
  for(const nm of parts){const r=await g(`/me/drive/root:/${enc(cur)}:/children`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,folder:{},'@microsoft.graph.conflictBehavior':'fail'})});
    if(!r.ok&&r.status!==409)throw new Error('mkdir '+r.status);cur+='/'+nm}
  const it=await g(`/me/drive/root:/${enc(cur)}?$select=id,webUrl,name`);return it.ok?it.json():null};
AUTH.putFile=async(path,blob,type)=>{const r=await g(`/me/drive/root:/${enc(rel(path))}:/content`,{method:'PUT',headers:{'Content-Type':type||'application/octet-stream'},body:blob});if(!r.ok)throw new Error('put '+r.status);return r.json()};
AUTH.item=async(path)=>{const r=await g(`/me/drive/root:/${enc(rel(path))}?$select=id,webUrl,name`);return r.ok?r.json():null};
AUTH.rename=async(path,name)=>{const r=await g(`/me/drive/root:/${enc(rel(path))}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});if(!r.ok)throw new Error('rename '+r.status);return r.json()};
AUTH.listDir=async(path)=>{const r=await g(`/me/drive/root:/${enc(rel(path))}:/children?$select=name,webUrl,size,lastModifiedDateTime,folder,file&$top=200`);if(r.status===404)return null;if(!r.ok)throw new Error('list '+r.status);return (await r.json()).value||[]};

// ---------- Outlook koncept ----------
AUTH.mailDraft=async({subject,html,to,pdfs,logo})=>{const t=await token(['Mail.ReadWrite']);
  const att=pdfs.map(p=>({'@odata.type':'#microsoft.graph.fileAttachment',name:p.name,contentType:'application/pdf',contentBytes:p.b64}));
  if(logo)att.push({'@odata.type':'#microsoft.graph.fileAttachment',name:'lnstatik.png',contentType:'image/png',contentBytes:logo,isInline:true,contentId:'lnlogo@lnstatik'});
  const r=await fetch(GRAPH+'/me/messages',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify({subject,body:{contentType:'HTML',content:html},toRecipients:String(to||'').split(/[,;]\s*/).filter(Boolean).map(a=>({emailAddress:{address:a}})),attachments:att})});
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(m||('Outlook '+r.status))}

const MAT={
 C16:{n:'C16',t:'r',fm:16,ft0:8.5,fc0:17,fv:3.2,E:8000,E05:5400,G:500,rk:310,rm:370},

const KMOD={1:{perm:.6,long:.7,med:.8,short:.9,inst:1.1},2:{perm:.6,long:.7,med:.8,short:.9,inst:1.1},3:{perm:.5,long:.55,med:.65,short:.7,inst:.9}};
const KDEF={1:.6,2:.8,3:2.0};
const GM={r:1.3,l:1.25};
function tramCalc(p){
 const m=MAT[p.mat];const L=p.L*1000,b=p.b,h=p.h;const sc=p.sc;
 const A=b*h,W=b*h*h/6,I=b*h**3/12;
 const gs=p.self?m.rm*9.81/1e3*(b/1000)*(h/1000):0;const G=p.gk+gs,Q=p.qk;
 const gM=GM[m.t];const kcr=0.67;
 const kh=m.t==='r'?(h<150?Math.min((150/h)**0.2,1.3):1):(h<600?Math.min((600/h)**0.1,1.1):1);
 const combos=[{n:'Len stále zaťaženie',Ed:p.gG*G,km:KMOD[sc].perm,dur:'perm'}];
 if(Q>0)combos.push({n:'Stále + premenné',Ed:p.gG*G+p.gQ*Q,km:KMOD[sc][p.dur],dur:p.dur});
 for(const c of combos){c.M=c.Ed*p.L**2/8;c.V=c.Ed*p.L/2;c.sig=c.M*1e6/W;c.tau=1.5*c.V*1e3/(kcr*b*h);
  c.fmd=c.km*kh*m.fm/gM;c.fvd=c.km*m.fv/gM;c.um=c.sig/c.fmd;c.uv=c.tau/c.fvd}
 const cm=combos.reduce((a,c)=>c.um>a.um?c:a),cv=combos.reduce((a,c)=>c.uv>a.uv?c:a);
 const w=q=>5*q*L**4/(384*m.E*I);const wG=w(G),wQ=w(Q);const kd=KDEF[sc];
 const winst=wG+wQ,wfin=wG*(1+kd)+wQ*(1+p.psi2*kd);const lim1=L/p.l1,lim2=L/p.l2;
 const r={m,L,b,h,A,W,I,gs,G,Q,gM,kcr,kh,kd,combos,cm,cv,wG,wQ,winst,wfin,lim1,lim2,ui:winst/lim1,uf:wfin/lim2};
 r.u=Math.max(cm.um,cv.uv,r.ui,r.uf);return r}

async function pLoadFiles(id){const p=S.items[id];const box=$('#pFiles');if(!p||!box||!pFs())return;
  try{const root=await AUTH.listDir(pFolder(p));if(!$('#pFiles'))return;
    if(!root){box.innerHTML='<p class="dim">Priečinok ešte neexistuje. Klikni na „Vytvoriť / doplniť priečinky“.</p>';return}
    const it=await AUTH.item(pFolder(p));if(it&&$('#pOpen')){$('#pOpen').href=it.webUrl;$('#pOpen').style.display=''}
    const subs=root.filter(x=>x.folder).sort((a,b)=>a.name.localeCompare(b.name));const files=root.filter(x=>x.file);
    const inner=await Promise.all(subs.map(f=>AUTH.listDir(pFolder(p)+'/'+f.name).catch(()=>[])));
    const fl=x=>`<a href="${esc(x.webUrl)}" target="_blank" rel="noopener" style="display:block;font-size:13.5px;padding:2px 0">${esc(x.name)}</a>`;
    box.innerHTML=`<div class="pgrid">${subs.map((f,i)=>`<div class="pfold"><a href="${esc(f.webUrl)}" target="_blank" rel="noopener" class="b" style="color:var(--ink);text-decoration:none">📁 ${esc(f.name)}</a><span class="dim" style="font-size:12px"> ${(inner[i]||[]).length||''}</span>${(inner[i]||[]).filter(x=>x.file).slice(0,6).map(fl).join('')}${(inner[i]||[]).length>6?'<div class="dim" style="font-size:12px">…</div>':''}</div>`).join('')}</div>${files.length?`<div style="margin-top:10px">${files.map(fl).join('')}</div>`:''}`}
  catch(e){console.warn(e);box.innerHTML='<p class="dim">Súbory sa nepodarilo načítať.</p>'}}
async function pMakeFolders(id,quiet){const p=S.items[id];if(!p||!pFs())return false;
  try{const f=pFolder(p);await AUTH.mkdir(f);for(const s of P_SUB)await AUTH.mkdir(f+'/'+s);if(!p.folder){S.items[id]={...S.items[id],folder:f};save(id,S.items[id])}if(!quiet)toast('Priečinky sú pripravené');if(S.proj===id)pLoadFiles(id);return true}
  catch(e){console.warn(e);toast('Priečinky sa nepodarilo vytvoriť');return false}}

 const DEF=sInDef(I,R);const BL=sBlk(I,R);

async function sPaginate(I,R,P){const B=sReportBlocks(I,R,P);const host=$('#paper');host.innerHTML=`<style>${RCSS}</style><div class="rp"><div class="pg" style="height:auto"><div id="mz"></div></div></div>`;const mz=host.querySelector('#mz');
 const ds=B.map(b=>{const d=document.createElement('div');d.className='blk';d.innerHTML=b.html;mz.appendChild(d);return d});try{await document.fonts.ready}catch(e){}await sRaster(mz);const hs=ds.map((d,i)=>{B[i].html=d.innerHTML;return d.offsetHeight+9});host.innerHTML='';
 const AV=1123-34-46-60;const pages=[];let cur=[],hcur=0;
 B.forEach((b,i)=>{let need=hs[i];if(b.keep&&i+1<B.length)need+=hs[i+1];if((b.brk||hcur+need>AV)&&cur.length){pages.push(cur);cur=[];hcur=0}cur.push(b);hcur+=hs[i]});if(cur.length)pages.push(cur);
 const N=pages.length;const today2=new Date().toLocaleDateString('sk-SK');
 return `<div class="rp">${pages.map((pg,i)=>`<div class="pg"><div class="ph">${sig(10,'#8B929B','#1F2328')}<div class="c">${i===0?'Montážny list':'Statický výpočet'} · Trámový strmeň ${esc(I.prvok||'')}</div><div class="r">${P?'Zákazka '+esc(P.no):''}</div></div>${pg.map(b=>`<div class="blk">${b.html}</div>`).join('')}<div class="pf"><span>LN · STATIK${I.vyp?' · vypracoval '+esc(I.vyp):''} · ${today2}</span><span>Strana ${i+1} / ${N}</span></div></div>`).join('')}</div>`}

 document.body.appendChild(d);const sc=Math.min(1,(d.querySelector('.pb').clientWidth-40)/794);if(sc<1)d.querySelectorAll('.rp .pg').forEach(p=>{p.style.transform=`scale(${sc})`;p.style.marginBottom=(20-1123*(1-sc))+'px'})}

const invTotal=i=>{const base=(i.items||[]).reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0);const vat=i.vatPayer?base*(+i.vatRate||0)/100:0;return {base,vat,total:Math.round((base+vat)*100)/100}};
const isOver=i=>i.status==='sent'&&i.dueDate<today();
function invTag(i){if(i.status==='paid')return '<span class="tag ok">Uhradená</span>';if(isOver(i))return '<span class="tag bad">Po splatnosti</span>';if(i.status==='sent')return '<span class="tag warn">Čaká na úhradu</span>';return '<span class="tag">Koncept</span>'}
function nextNumber(){const st=settings();const pre=(st.prefix||'')+new Date().getFullYear();
  const n=list('invoice').map(i=>String(i.number||'')).filter(x=>x.startsWith(pre)).map(x=>parseInt(x.slice(pre.length))||0);
  return pre+String((n.length?Math.max(...n):0)+1).padStart(3,'0')}
const yearsOf=()=>{const y=new Set([new Date().getFullYear()]);list('invoice').forEach(i=>i.issueDate&&y.add(+i.issueDate.slice(0,4)));list('event').forEach(e=>e.date&&y.add(+e.date.slice(0,4)));return [...y].sort()};
function yearSel(){return `<span class="yr"><button aria-label="Predošlý rok" onclick="S.year--;render()">‹</button><span style="min-width:56px;text-align:center">${S.year}</span><button aria-label="Ďalší rok" onclick="S.year++;render()">›</button></span>`}
const DEF_BAND=['Tomi','Laci','Marian','Daniel','Adam'];
function bandCfg(){const s=S.items.settings||{};return {members:(s.bandMembers&&s.bandMembers.length?s.bandMembers:DEF_BAND),me:s.bandMe||'Laci'}}
function splitOf(e){const c=bandCfg();const names=e.split&&Object.keys(e.split).length?Object.keys(e.split):c.members;const fee=+e.fee||0;
  const set=names.filter(n=>e.split&&e.split[n]&&e.split[n].base!==''&&e.split[n].base!==undefined);const fixed=set.reduce((s,n)=>s+(+e.split[n].base||0),0);
  const rest=names.length-set.length;const eq=rest?(fee-fixed)/rest:0;
  return names.map(n=>{const s=(e.split||{})[n]||{};const base=set.includes(n)?(+s.base||0):eq;let fuel=+s.fuel||0;if(!e.split&&n===c.me)fuel=+e.myFuel||0;return {name:n,base:Math.round(base*100)/100,fuel,total:Math.round((base+fuel)*100)/100}})}
const bandShare=e=>{const me=bandCfg().me;const r=splitOf(e).find(x=>x.name===me);return r?r.total:0};
const earned=e=>e.earned!==undefined&&e.earned!==''?+e.earned||0:(+e.fee?bandShare(e):0);

function vOverview(){
  const y=String(S.year);
  const inv=list('invoice').filter(i=>(i.issueDate||'').startsWith(y));
  const ev=list('event').filter(e=>(e.date||'').startsWith(y)&&e.status!=='cancel');
  const invoiced=inv.reduce((s,i)=>s+invTotal(i).total,0);
  const paid=inv.filter(i=>i.status==='paid').reduce((s,i)=>s+invTotal(i).total,0);
  const open=inv.filter(i=>i.status==='sent').reduce((s,i)=>s+invTotal(i).total,0);
  const bandE=ev.reduce((s,e)=>s+earned(e),0);
  const gigs=ev.filter(e=>e.type!=='Skúška');
  const t=today();
  const nextEv=list('event').filter(e=>e.date>=t&&e.status!=='cancel').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
  const unpaid=list('invoice').filter(i=>i.status==='sent').sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const hoursY=list('time').filter(e=>new Date(e.start).getFullYear()===S.year).reduce((s,e)=>s+(e.end-e.start),0);
  const empty=!list('invoice').length;const expY=list('expense').reduce((s,x)=>s+expInYear(x,S.year).total,0);
  return `<div class="head"><div><h1>Prehľad roka</h1><p class="lead">Koľko si fakturoval za statiku a koľko si zarobil s kapelou.</p></div>${yearSel()}</div>
  ${empty?importBox():''}${autoBox()}
  <div class="figs">
    <div class="fig"><div class="v">${eur0(invoiced)}</div><div class="k">Statika – fakturované (${inv.length})</div></div>
    <div class="fig"><div class="v">${eur0(paid)}</div><div class="k">Statika – uhradené</div></div>
    <div class="fig"><div class="v" style="${open?'color:var(--warn)':''}">${eur0(open)}</div><div class="k">Čaká na úhradu</div></div>
    <div class="fig"><div class="v">${eur0(bandE)}</div><div class="k">Kapela – môj podiel (${gigs.length} akcií)</div></div>
    <div class="fig"><div class="v" style="${expY?'color:var(--bad)':''}">${expY?'−'+eur0(expY):eur0(0)}</div><div class="k">Výdavky</div></div>
    <div class="fig total"><div class="v">${eur0(paid+bandE-expY)}</div><div class="k">Zostane po výdavkoch</div></div>
  </div>
  <div class="panel" style="margin-bottom:22px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><h3>Príjmy po mesiacoch, ${y}</h3><span class="dim" style="font-size:13px">Odpracované hodiny za rok: ${fh(hoursY)}</span></div>
    <div class="legend"><span><i style="background:var(--stat)"></i>Statika (fakturované)</span><span><i style="background:var(--band)"></i>Kapela (zarobené)</span></div>
    <div class="chart" id="chart">${chartSVG(inv,ev)}<div class="tip" id="tip"></div></div>

function chartSVG(inv,ev){
  const A=Array(12).fill(0),B=Array(12).fill(0);
  inv.forEach(i=>A[+i.issueDate.slice(5,7)-1]+=invTotal(i).total);
  ev.forEach(e=>B[+e.date.slice(5,7)-1]+=earned(e));
  S.chartData={A,B};
  const W=900,H=260,L=56,R=8,T=10,Bm=28,ih=H-T-Bm,iw=W-L-R;
  const mx=Math.max(100,...A,...B);const step=[100,200,250,500,1000,2000,2500,5000,10000].find(s=>mx/s<=5)||Math.ceil(mx/5);
  const top=Math.ceil(mx/step)*step;const yy=v=>T+ih-(v/top)*ih;
  const gw=iw/12,bw=Math.min(22,(gw-14)/2);
  let g='';for(let v=0;v<=top;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${yy(v)}" y2="${yy(v)}" stroke="${v?'#ECEEEF':'#C9CDD2'}"/><text x="${L-8}" y="${yy(v)+4}" text-anchor="end" font-size="12" fill="#868D96">${v.toLocaleString('sk-SK')}</text>`}
  const bar=(x,v,c)=>{if(!v)return'';const h=Math.max(2,(v/top)*ih),y=T+ih-h,r=Math.min(4,h/2);return `<path d="M${x} ${T+ih} V${y+r} Q${x} ${y} ${x+r} ${y} H${x+bw-r} Q${x+bw} ${y} ${x+bw} ${y+r} V${T+ih} Z" fill="${c}"/>`};
  let b='';for(let m=0;m<12;m++){const cx=L+gw*m+gw/2;
    b+=bar(cx-bw-1,A[m],'#1F6FB0')+bar(cx+1,B[m],'#C2872B');
    b+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="#868D96">${MON[m]}</text><rect class="hit" data-m="${m}" x="${L+gw*m}" y="${T}" width="${gw}" height="${ih}" fill="transparent"/>`}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Príjmy po mesiacoch">${g}${b}</svg>`;
}
function bindChart(){const c=$('#chart');if(!c)return;const tip=$('#tip');
  c.querySelectorAll('.hit').forEach(h=>{h.addEventListener('mouseenter',()=>{const m=+h.dataset.m,{A,B}=S.chartData;
    const svg=c.querySelector('svg'),sr=svg.getBoundingClientRect(),hr=h.getBoundingClientRect(),cr=c.getBoundingClientRect();
    tip.innerHTML=`<b>${MON[m]} ${S.year}</b><br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#1F6FB0;margin-right:6px"></i>Statika ${eur(A[m])}<br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#C2872B;margin-right:6px"></i>Kapela ${eur(B[m])}`;

const XCAT=['Odvody a poistenie','Poistenie','Softvér a licencie','Telefón a internet','Auto','Kancelária','Účtovníctvo','Banka','Vzdelávanie','Iné'];
const XPER={m:'Mesačne',q:'Štvrťročne',y:'Ročne',o:'Jednorazovo'};
function expInYear(x,yr){const a=+x.amount||0;const mon=Array(12).fill(0);if(!a)return {mon,total:0};
  const s=x.start||x.date||`${yr}-01-01`;const sy=+s.slice(0,4),sm=+s.slice(5,7)-1;const e=x.end||'';const ey=e?+e.slice(0,4):9999,em=e?+e.slice(5,7)-1:11;
  const inR=(y,m)=>(y>sy||y===sy&&m>=sm)&&(y<ey||y===ey&&m<=em);
  for(let m=0;m<12;m++){if(!inR(yr,m))continue;
    if(x.period==='m')mon[m]+=a;
    else if(x.period==='q'){if(((m-sm)%3+3)%3===0)mon[m]+=a}
    else if(x.period==='y'){if(m===sm)mon[m]+=a}
    else if(x.period==='o'){if(yr===sy&&m===sm)mon[m]+=a}}
  return {mon,total:mon.reduce((p,c)=>p+c,0)}}
const perMonth=x=>{const a=+x.amount||0;return x.period==='m'?a:x.period==='q'?a/3:x.period==='y'?a/12:0};

function wkMd(t){const e=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*(.+?)\*(?=\s|$)/g,'$1<i>$2</i>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 const L=String(t||'').split('\n');let o='',ul=0,tb=0;const close=()=>{if(ul){o+='</ul>';ul=0}if(tb){o+='</tbody></table>';tb=0}};
 L.forEach(l=>{let m;if(m=l.match(/^(#{1,3})\s+(.*)/)){close();o+=`<h${m[1].length+1}>${e(m[2])}</h${m[1].length+1}>`}
  else if(m=l.match(/^\s*[-•]\s+(.*)/)){if(tb){o+='</tbody></table>';tb=0}if(!ul){o+='<ul>';ul=1}o+=`<li>${e(m[1])}</li>`}
  else if(/^\s*\|.*\|\s*$/.test(l)){if(/^\s*\|[\s:|-]+\|\s*$/.test(l))return;if(ul){o+='</ul>';ul=0}const c=l.trim().slice(1,-1).split('|');if(!tb){o+='<table class="wtb"><tbody>';tb=1}o+=`<tr>${c.map(x=>`<td>${e(x.trim())}</td>`).join('')}</tr>`}
  else if(!l.trim()){close()}else{close();o+=`<p>${e(l)}</p>`}});close();return o}
function vWiki(){const all=list('wiki').sort((a,b)=>(a.cat||'').localeCompare(b.cat||'','sk')||(a.title||'').localeCompare(b.title||'','sk'));
 const q=(S.wq||'').toLowerCase();const sh=q?all.filter(p=>((p.title||'')+' '+(p.cat||'')+' '+(p.body||'')).toLowerCase().includes(q)):all;
 const cats={};sh.forEach(p=>(cats[p.cat||'Nezaradené']=cats[p.cat||'Nezaradené']||[]).push(p));
 const cur=S.wp&&S.items[S.wp]?{...S.items[S.wp],id:S.wp}:null;
 let right;
 if(S.wikiEdit){const p=S.wikiEdit==='new'?{title:'',cat:S.wcat||'',body:''}:{...S.items[S.wikiEdit]};const cl=[...new Set(all.map(x=>x.cat).filter(Boolean))];
  right=`<div class="panel wed"><div class="wedh"><input id="wt" placeholder="Názov stránky" value="${esc(p.title)}"><input id="wc" list="wcl" placeholder="Kapitola" value="${esc(p.cat||'')}"><datalist id="wcl">${cl.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
   <textarea id="wb" placeholder="# Nadpis&#10;Text odseku…&#10;- odrážka&#10;| tabuľka | hodnota |">${esc(p.body||'')}</textarea>
   <div class="whelp"># nadpis · - odrážka · **tučné** · | stĺpec | stĺpec | · [odkaz](https://…)</div>
   <div class="mfoot"><div>${S.wikiEdit!=='new'?`<button class="btn q" onclick="wkDel('${S.wikiEdit}')">Zmazať</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn" onclick="S.wikiEdit=null;render()">Zrušiť</button><button class="btn p" onclick="wkSave()">Uložiť</button></div></div></div>`}
 else if(cur)right=`<article class="panel wpage"><div class="wph"><div><div class="wcat">${esc(cur.cat||'Nezaradené')}</div><h1>${esc(cur.title)}</h1></div><button class="btn" onclick="S.wikiEdit='${cur.id}';render()">Upraviť</button></div><div class="wbody">${wkMd(cur.body)}</div><div class="dim" style="font-size:12px;margin-top:18px">Upravené ${cur.upd?new Date(cur.upd).toLocaleDateString('sk-SK'):''}</div></article>`;
 else right=`<div class="panel"><div class="empty"><p>${all.length?'Vyber stránku vľavo alebo vyhľadaj.':'Zatiaľ prázdne. Sem si zapisuj veci, ktoré stále hľadáš – súčinitele, postupy, kontakty na výrobcov, poznámky k normám.'}</p><button class="btn p" onclick="S.wikiEdit='new';render()">Nová stránka</button></div></div>`;
 return `<div class="head"><div><h1>Wiki</h1><p class="lead">Súkromné poznámky a know-how.</p></div><button class="btn p" onclick="S.wikiEdit='new';render()">Nová stránka</button></div>
 <div class="wgrid"><div class="panel wside"><input placeholder="Hľadať…" value="${esc(S.wq||'')}" oninput="S.wq=this.value;clearTimeout(window._wq);window._wq=setTimeout(()=>{render();const i=document.querySelector('.wside input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)">
  ${Object.entries(cats).map(([c,ps])=>`<div class="wgh">${esc(c)}</div>${ps.map(p=>`<button class="${p.id===S.wp?'on':''}" onclick="S.wp='${p.id}';S.wikiEdit=null;render()">${esc(p.title||'Bez názvu')}</button>`).join('')}`).join('')||'<div class="dim" style="padding:8px 4px">Nič sa nenašlo.</div>'}</div><div>${right}</div></div>`}
function wkSave(){const t=$('#wt').value.trim();if(!t){toast('Zadaj názov');return}const id=S.wikiEdit==='new'?'wk_'+uid():S.wikiEdit;
 const o={...(S.items[id]||{}),kind:'wiki',title:t,cat:$('#wc').value.trim(),body:$('#wb').value,upd:Date.now()};S.wikiEdit=null;S.wp=id;save(id,o);toast('Uložené')}

function woodHero(){const now=new Date();const hr=now.getHours();const gr=hr<10?'Dobré ráno':hr<18?'Dobrý deň':'Dobrý večer';
 const dt=(s=>s[0].toUpperCase()+s.slice(1))(now.toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
 const grain=Array.from({length:14},(_,i)=>{const y=14+i*17,a=6+((i*7)%9),b=4+((i*5)%7);return `<path d="M-20 ${y} C 160 ${y-a}, 320 ${y+b}, 520 ${y-2} S 860 ${y+a}, 1220 ${y-b}" stroke="#8A5A2B" stroke-opacity="${0.07+((i%3)*0.03)}" stroke-width="${1+(i%4)*0.6}" fill="none"/>`}).join('');
 const knot=(x,y,r)=>`<ellipse cx="${x}" cy="${y}" rx="${r*1.9}" ry="${r}" fill="none" stroke="#7A4A20" stroke-opacity=".16" stroke-width="1.4"/><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.5}" fill="#7A4A20" fill-opacity=".10"/>`;
 // väzník
 const tr=`<g transform="translate(700,52)" stroke="#5B3A1C" stroke-linejoin="round" stroke-linecap="round" fill="none"><path d="M0 150 L190 30 L380 150 Z" stroke-width="7" stroke-opacity=".55"/><path d="M95 150 L135 65 M285 150 L245 65 M95 150 L190 90 L285 150 M190 30 L190 150" stroke-width="4" stroke-opacity=".45"/><path d="M-30 150 H410" stroke-width="3" stroke-opacity=".25"/>${[0,95,190,285,380].map(x=>`<circle cx="${x}" cy="150" r="5" fill="#5B3A1C" fill-opacity=".35" stroke="none"/>`).join('')}</g>`;
 return `<section class="hero"><svg class="hgr" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="hw" x1="0" x2="1"><stop offset="0" stop-color="#F3E3C8"/><stop offset=".55" stop-color="#E9D2AE"/><stop offset="1" stop-color="#DDBF92"/></linearGradient></defs><rect width="1200" height="240" fill="url(#hw)"/>${grain}${knot(250,128,9)}${knot(560,62,6)}${knot(1080,200,8)}${tr}</svg>
 <div class="hin"><div class="hk">LN · STATIK — drevené konštrukcie</div><h1>${gr}${AUTH&&AUTH.user?'':''}.</h1><p>${dt}</p>
  <div class="hq">${[['projekty','Projekty',pList().filter(x=>!['zamietnuta','fakturovana'].includes(x.status)).length+' aktívnych'],['tahaky','Ťaháky','materiály, normy, väzby'],['vypocty','Výpočty',CMODS.length+' modulov'],['wiki','Wiki',list('wiki').length+' stránok']].map(([v,n,s])=>`<button onclick="go('${v}')"><b>${n}</b><span>${s}</span></button>`).join('')}</div></div></section>`}
function homeTimer(){if(!(window.AUTH&&AUTH.owner!==false))return '';const st=settings(),r=st.running;const FL=clientNames();const F=S.firm;
 const today=new Date();today.setHours(0,0,0,0);const tsum=F?list('time').filter(e=>fkey(e.client||e.project)===F.key&&e.start>=today.getTime()).reduce((s,e)=>s+(e.end-e.start),0):0;
 return `<div class="panel htm"><div class="clock ${r?'run':''}" id="clock">${r?dur(Date.now()-r.start):'00:00:00'}</div>
  <div class="htc">${r?`<div class="b" style="font-size:16px">${esc(r.client)}</div><div class="dim">${esc(r.note||'Bez popisu')}</div>`:`<div class="htr"><select id="firmSel" onchange="selFirm(this.value)"><option value="">— vyber firmu —</option>${FL.map(n=>`<option ${F&&fkey(n)===F.key?'selected':''}>${esc(n)}</option>`).join('')}</select>${F?'<input id="tNote" placeholder="Čo robíš?">':''}</div>${F?`<div class="dim" style="font-size:12.5px;margin-top:4px">Dnes pre ${esc(F.name)}: ${fh(tsum)} · <a href="#" onclick="event.preventDefault();editTime()">pridať čas ručne</a></div>`:''}`}</div>
  ${r?'<button class="go stop" onclick="stopTimer()" aria-label="Zastaviť">■</button>':F?'<button class="go" onclick="startTimer()" aria-label="Spustiť">▶</button>':''}</div>`}
function vHome(){const N=list('navrh').sort((a,b)=>(a.st==='hotové')-(b.st==='hotové')||b.at-a.at);const ST=['nový','v riešení','hotové'];
 return woodHero()+homeTimer()+`<div class="panel nav2"><div class="nvh"><div><h3 style="margin:0">Návrhy na zlepšenie</h3><p class="dim" style="margin:2px 0 0;font-size:13px">Čo by nám uľahčilo prácu – nápady na kalkulačky, ťaháky, postupy.</p></div></div>

function beamModel(spans,c,EI){// spans [m], c previs na pravom konci [m], EI [kNm²]
 const F=[...spans.map(L=>({L,ne:24,sp:1})),...(c>0?[{L:c,ne:10,sp:0}]:[])];const x=[0],fld=[];let sup=[0];
 F.forEach((f,fi)=>{const l=f.L/f.ne;for(let k=0;k<f.ne;k++){x.push(x[x.length-1]+l);fld.push(fi)}if(f.sp)sup.push(x.length-1)});
 const nN=x.length,nD=2*nN;const K=Array.from({length:nD},()=>new Float64Array(nD));
 for(let e=0;e<nN-1;e++){const l=x[e+1]-x[e],k=EI/l**3,m=[[12,6*l,-12,6*l],[6*l,4*l*l,-6*l,2*l*l],[-12,-6*l,12,-6*l],[6*l,2*l*l,-6*l,4*l*l]],d=[2*e,2*e+1,2*e+2,2*e+3];
  for(let i=0;i<4;i++)for(let j=0;j<4;j++)K[d[i]][d[j]]+=k*m[i][j]}
 const fixed=new Set(sup.map(n=>2*n));const free=[];for(let i=0;i<nD;i++)if(!fixed.has(i))free.push(i);
 const n=free.length;const A=free.map(i=>Float64Array.from(free.map(j=>K[i][j])));
 // LU (bez pivotovania – K je SPD)
 for(let k=0;k<n;k++)for(let i=k+1;i<n;i++){const f=A[i][k]/A[k][k];if(!f)continue;A[i][k]=f;for(let j=k+1;j<n;j++)A[i][j]-=f*A[k][j]}
 const solve=b=>{const y=Float64Array.from(free.map(i=>b[i]));for(let i=0;i<n;i++)for(let j=0;j<i;j++)y[i]-=A[i][j]*y[j];for(let i=n-1;i>=0;i--){for(let j=i+1;j<n;j++)y[i]-=A[i][j]*y[j];y[i]/=A[i][i]}const u=new Float64Array(nD);free.forEach((g,i)=>u[g]=y[i]);return u};

  <div class="fr"><div class="f"><label>Názov</label><input name="title" value="${esc(e.title)}" placeholder="napr. Svadba Kováčovci"></div><div class="f"><label>Typ</label><select name="type">${ETYPES.map(x=>`<option ${x===e.type?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <div class="fr"><div class="f"><label>Dátum</label><input type="date" name="date" value="${esc(e.date)}" required></div><div class="f"><label>Čas</label><input type="time" name="time" value="${esc(e.time)}"></div><div class="f"><label>Stav</label><select name="status">${Object.entries(EST).map(([k,v])=>`<option value="${k}" ${k===e.status?'selected':''}>${v[0]}</option>`).join('')}</select></div></div>
  <div id="dovWarn" class="note" style="display:none;margin-bottom:12px"></div>
  <label class="chk" style="margin:-4px 0 12px;display:flex;gap:8px;align-items:center"><input type="checkbox" name="public" ${isPub(e)?'checked':''}> <span><b>Verejná akcia</b> <span class="dim">– zobrazí sa na verejnom kalendári pre ľudí (bez cien a kontaktov)</span></span></label>
  <div class="fr"><div class="f"><label>Miesto</label><input name="venue" value="${esc(e.venue)}"></div><div class="f"><label>Obec / mesto</label><input name="city" value="${esc(e.city)}"></div></div>
  <div class="panel" style="padding:14px 16px;margin-bottom:12px;background:var(--paper)">
   <div class="fr"><div class="f"><label>Cena za akciu (€)</label><input type="number" step="0.01" name="fee" value="${esc(e.fee)}"></div><div class="f"><label>Nafta navyše (€)</label><input type="number" step="0.01" name="fuel" value="${esc(e.fuel??'')}" placeholder="0"></div></div>
   <label class="chk" style="margin:-2px 0 12px;display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><input type="checkbox" name="clientPaid" ${e.status==='paid'?'checked':''}> Klient zaplatil</label>
   <label style="margin-top:4px">Rozdelenie medzi členov</label>
   <table style="background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px"><thead><tr><th>Člen</th><th class="r">Podiel z ceny €</th><th class="r">Nafta €</th><th class="r">Spolu</th><th class="r" style="width:90px">Vyplatené</th></tr></thead><tbody>${bandCfg().members.map(n=>{const s=(e.split||{})[n]||{};const f0=s.fuel!==undefined?s.fuel:(n===bandCfg().me&&e.myFuel?e.myFuel:'');return `<tr><td class="b">${esc(n)}${n===bandCfg().me?' <span class="dim" style="font-weight:400">(ja)</span>':''}</td><td class="r"><input data-sb="${esc(n)}" type="number" step="0.01" value="${esc(s.base??'')}" style="width:110px;text-align:right;padding:5px 8px"></td><td class="r"><input data-sf="${esc(n)}" type="number" step="0.01" value="${esc(f0)}" placeholder="0" style="width:90px;text-align:right;padding:5px 8px"></td><td class="r b" data-st="${esc(n)}"></td><td class="r"><input type="checkbox" data-sp="${esc(n)}" ${s.paid?'checked':''} style="width:18px;height:18px"></td></tr>`}).join('')}</tbody></table>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><button type="button" class="btn sm" id="fuelEven">Naftu rozdeliť rovnako</button><button type="button" class="btn sm q" id="splitReset">Podiely rovnako</button></div>
   <div id="split" class="dim" style="font-size:13.5px"></div>
  </div>
  <div class="fr"><div class="f"><label>Záloha (€)</label><input type="number" step="0.01" name="deposit" value="${esc(e.deposit??'')}" placeholder="0"></div><div class="f"><label>U koho je záloha</label><select name="depositBy"><option value="">—</option>${[...new Set(['Laci','Tomi',e.depositBy].filter(Boolean))].map(n=>`<option ${n===e.depositBy?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="f" style="display:flex;align-items:flex-end"><label class="chk" style="margin-bottom:10px"><input type="checkbox" name="depositPaid" ${e.depositPaid?'checked':''}> Záloha prijatá</label></div></div>
  <div class="f"><label>Prílohy (PDF, obrázky)</label><div id="atts"></div><div style="display:flex;gap:10px;align-items:center;margin-top:6px"><label class="btn sm" style="margin:0;cursor:pointer" id="attBtn">Pridať prílohu<input type="file" id="attIn" multiple accept="image/png,image/jpeg,image/gif,image/webp,application/pdf" style="display:none"></label><span class="dim" id="attMsg" style="font-size:13px"></span></div></div>
  <div class="fr"><div class="f"><label>Kontaktná osoba</label><input name="contact" value="${esc(e.contact)}"></div><div class="f"><label>Telefón / e-mail</label><input name="contactEmail" value="${esc(e.contactEmail)}"></div></div>
  <div class="f"><label>Poznámky</label><textarea name="notes" placeholder="program, technika, záloha, parkovanie…">${esc(e.notes)}</textarea></div>
  <div class="mfoot"><div>${id?`<button type="button" class="btn q bad" onclick="if(sure(this,'Naozaj zmazať?')){del('${id}');closeModal()}">Zmazať</button>`:''}</div><div style="display:flex;gap:8px"><button type="button" class="btn" onclick="closeModal()">Zrušiť</button><button class="btn p">Uložiť</button></div></div></form>`);
  const ef=$('#evf');const readSplit=()=>{const o={};bandCfg().members.forEach(n=>{o[n]={base:ef.querySelector(`[data-sb="${n}"]`).value,fuel:ef.querySelector(`[data-sf="${n}"]`).value,paid:ef.querySelector(`[data-sp="${n}"]`).checked}});return o};
  const upd=()=>{const x={fee:ef.fee.value,fuel:ef.fuel.value,split:readSplit()};const fee=+x.fee||0,fuel=+x.fuel||0;const sp=splitOf(x);const eq=fee/Math.max(1,sp.length);
    sp.forEach(r=>{ef.querySelector(`[data-sb="${r.name}"]`).placeholder=r.base.toFixed(2);ef.querySelector(`[data-st="${r.name}"]`).textContent=eur(r.total)});
    const sb=sp.reduce((s,r)=>s+r.base,0),sf=sp.reduce((s,r)=>s+r.fuel,0);const warn=[];
    if(fee&&Math.abs(sb-fee)>0.01)warn.push(`podiely spolu ${eur(sb)} ≠ cena ${eur(fee)}`);if(Math.abs(sf-fuel)>0.01)warn.push(`nafta rozdelená ${eur(sf)} z ${eur(fuel)}`);
    $('#split').innerHTML=fee?`Od klienta spolu <b style="color:var(--ink)">${eur(fee+fuel)}</b>${warn.length?` · <span style="color:var(--warn)">${warn.join(' · ')}</span>`:' · všetko rozdelené'}`:'Zadaj cenu za akciu a podiely sa vypočítajú samé.'};
  ef.addEventListener('input',upd);upd();
  ef.type.addEventListener('change',()=>{ef.public.checked=PUB_T.includes(ef.type.value)});
  const dw=()=>{const w=dovOn(ef.date.value);const el=$('#dovWarn');if(!el)return;el.style.display=w.length?'':'none';el.innerHTML=w.length?'Pozor, v tento deň má dovolenku: <b>'+esc(w.map(x=>x.kto).join(', '))+'</b>':''};ef.date.addEventListener('change',dw);dw();loadDov().then(dw);
  ef.clientPaid.onchange=()=>{if(ef.clientPaid.checked)ef.status.value='paid';else if(ef.status.value==='paid')ef.status.value=ef.date.value<today()?'done':'ok'};ef.status.onchange=()=>{ef.clientPaid.checked=ef.status.value==='paid'};
  $('#fuelEven').onclick=()=>{const fuel=+ef.fuel.value||0,ms=bandCfg().members;ms.forEach(n=>ef.querySelector(`[data-sf="${n}"]`).value=fuel?(Math.round(fuel/ms.length*100)/100):'');upd()};
  $('#splitReset').onclick=()=>{bandCfg().members.forEach(n=>ef.querySelector(`[data-sb="${n}"]`).value='');upd()};
  let atts=[...(e.attachments||[])];const removed=[],fresh=[];
  const drawAtts=()=>{$('#atts').innerHTML=atts.length?atts.map((a,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)"><span class="dim" style="font-size:12px;width:34px">${a.type==='application/pdf'?'PDF':'OBR'}</span><a href="/_blob/${esc(a.id)}" target="_blank" rel="noopener" style="flex:1;color:var(--ink)">${esc(a.name)}</a><span class="dim" style="font-size:12px">${a.size>=1048576?(a.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(a.size/1024))+' kB'}</span><button type="button" class="btn q sm" data-rm="${i}" aria-label="Odstrániť prílohu">✕</button></div>`).join(''):'<div class="dim" style="font-size:13px">Žiadne prílohy.</div>'};
  drawAtts();
  $('#atts').onclick=ev2=>{const r=ev2.target.dataset.rm;if(r!==undefined){const a=atts.splice(+r,1)[0];if(a)removed.push(a.id);drawAtts()}};
  $('#attIn').onchange=async ev2=>{const files=[...ev2.target.files];ev2.target.value='';if(!files.length)return;
    const assets=await claude.use('assets');if(!assets){$('#attMsg').textContent='Prílohy sa nepodarilo pripojiť k OneDrive.';return}
    for(const f0 of files){$('#attMsg').textContent='Nahrávam '+f0.name+'…';
      try{let f=f0,type=f0.type;
        if(/^image\/(png|jpeg|webp)$/.test(type)&&f0.size>3e5){f=await shrinkImg(f0);type='image/jpeg'}
        if(!/^(image\/(png|jpeg|gif|webp)|application\/pdf)$/.test(type)){toast('Podporované sú len PDF a obrázky (JPG, PNG, GIF, WEBP)');continue}
        const r=await assets.upload(f,{type});const a={id:r.id,name:f0.name,type:r.contentType,size:r.sizeBytes};atts.push(a);fresh.push(a.id);drawAtts()}
      catch(err){toast(err&&err.code==='too_large'?'Súbor je väčší ako 20 MB':err&&err.code==='quota_or_state'?'Úložisko príloh je plné':'Prílohu sa nepodarilo nahrať')}}
    $('#attMsg').textContent=''};
  $('#evf').querySelector('button.btn:not(.p):not(.q)')?.addEventListener('click',async()=>{if(fresh.length){const as=await claude.use('assets');if(as)for(const x of fresh)try{await as.delete(x)}catch(e){}}});
  $('#evf').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);const o={...e,kind:'event'};['title','type','date','time','status','venue','city','fee','fuel','deposit','depositBy','contact','contactEmail','notes'].forEach(k=>o[k]=f.get(k)||'');o.split=readSplit();o.members=bandCfg().members.length;delete o.myFuel;delete o.earned;o.depositPaid=!!f.get('depositPaid');o.public=!!f.get('public');
    o.attachments=atts;delete o.client;delete o.invoiceId;save(id||('ev_'+uid()),o);closeModal();toast('Akcia je uložená');
    if(removed.length)claude.use('assets').then(as=>{if(as)removed.forEach(x=>as.delete(x).catch(()=>{}))})}}

async function shrinkImg(file){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((ok,er)=>{img.onload=ok;img.onerror=er;img.src=url});
  const s=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.78))}finally{URL.revokeObjectURL(url)}}

document.addEventListener('submit',e=>{if(e.target.id!=='sf')return;e.preventDefault();const f=new FormData(e.target);const st=settings();const biz={};
  ['name','street','city','country','ico','dic','icdph','iban','swift','contact','phone','email','reg'].forEach(k=>biz[k]=(f.get(k)||'').trim());
  save('settings',{...st,biz,bandName:(f.get('bandName')||'Simple Band').trim(),bandPhone:(f.get('bandPhone')||'').trim(),bandEmail:(f.get('bandEmail')||'').trim(),dovUrl:(f.get('dovUrl')||'').trim(),dovKey:(f.get('dovKey')||'').trim(),bandUser:(f.get('bandUser')||'simple').trim(),bandPw:f.get('bandPw')||'0000SB',ghToken:(f.get('ghToken')||'').trim()||st.ghToken||'',bandMembers:(f.get('bandMembers')||'').split(',').map(x=>x.trim()).filter(Boolean),bandMe:(f.get('bandMe')||'Laci').trim(),mailSubj:f.get('mailSubj')||DEF_SUBJ,mailBody:f.get('mailBody')||DEF_BODY,desc:f.get('desc')||DESC,dueDays:+f.get('dueDays')||14,prefix:(f.get('prefix')||'').trim(),rate:+f.get('rate')||0,vatPayer:!!f.get('vatPayer'),vatRate:+f.get('vatRate')||0});toast('Nastavenia sú uložené')});
function setImg(k,v){save('settings',{...settings(),[k]:v})}
async function exportBackup(btn){const data={app:'LNStatik',verzia:1,vytvorene:new Date().toISOString(),items:S.items};
  try{const dl=await claude.use('downloads');if(!dl){toast('Sťahovanie tu nie je dostupné.');return}
    await dl.save({filename:`LNStatik_zaloha_${today()}.json`,data:JSON.stringify(data,null,1)});toast('Záloha je stiahnutá')}catch(e){if(!(e&&e.code==='declined'))toast('Zálohu sa nepodarilo stiahnuť')}}
function importBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast('Súbor nie je platná záloha LNStatik');return}
  let items=d&&d.items&&typeof d.items==='object'?d.items:d;if(Array.isArray(items))items=Object.fromEntries(items.map(x=>[x.id,x.data||x]));
  const ids=Object.keys(items||{}).filter(k=>items[k]&&items[k].kind);if(!ids.length){toast('V súbore nie sú žiadne dáta LNStatik');return}
  const n={invoice:0,client:0,time:0,event:0};ids.forEach(k=>{if(n[items[k].kind]!==undefined)n[items[k].kind]++});
  modal(`<h2>Obnoviť zo zálohy</h2><p>Zo súboru sa obnoví: <b>${n.invoice}</b> faktúr, <b>${n.client}</b> odberateľov, <b>${n.time}</b> záznamov času, <b>${n.event}</b> akcií a tvoje nastavenia.</p><p class="dim">Záznamy s rovnakým označením sa prepíšu verziou zo zálohy. Ostatné tvoje dáta ostanú.</p><div class="mfoot"><span></span><div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Zrušiť</button><button class="btn p" id="doRestore">Obnoviť</button></div></div>`);
  $('#doRestore').onclick=()=>{ids.forEach(k=>{const v={...items[k]};if(k==='settings')v.running=null;save(k,v)});closeModal();toast('Dáta zo zálohy sú obnovené')}};r.readAsText(f);inp.value=''}
function pickImg(inp,k){const file=inp.files[0];if(!file)return;const img=new Image();const r=new FileReader();
  r.onload=()=>{img.onload=()=>{const max=k==='logo'?600:500;const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);setImg(k,c.toDataURL('image/png'));toast('Obrázok je nahratý')};img.src=r.result};r.readAsDataURL(file)}

// ===== modal =====
function modal(h){const d=document.createElement('div');d.id='mroot';d.innerHTML=`<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">${h}</div></div>`;closeModal();document.body.appendChild(d);
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});const i=d.querySelector('input:not([readonly]),select');if(i)setTimeout(()=>i.focus(),30)}
function closeModal(){const m=$('#mroot');if(m)m.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#mroot'))closeModal();else if(ED)closeEditor()}});

init();
</script>
