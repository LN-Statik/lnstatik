<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SB Kalendár</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2F3F1;--surface:#fff;--ink:#1F2328;--ink2:#4E555D;--muted:#868D96;--line:#DFE2E4;--line2:#ECEEEF;--ok:#2E7D4F;--warn:#A86500;--bad:#B3261E;--on:#1F6FB0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,sans-serif;font-feature-settings:"tnum" 1}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px}
.card h1{margin:0 0 4px;font-size:24px}
.card p{margin:0 0 20px;color:var(--ink2)}
label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin:0 0 5px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:14px}
input:focus{outline:none;border-color:var(--ink)}
.btn{width:100%;border:0;background:var(--ink);color:#fff;padding:12px;border-radius:8px;font-weight:600;cursor:pointer}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
header{background:var(--ink);color:#fff;padding:18px 20px}
header .row{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:20px}
header small{color:#9AA0A8}
.yr{display:flex;align-items:center;gap:6px;font-weight:700}
.yr button{border:1px solid #3A4048;background:transparent;color:#fff;width:32px;height:32px;border-radius:7px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:20px 16px 50px}
.figs{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
.fig{background:var(--surface);padding:14px 16px}
.fig .v{font-size:22px;font-weight:700;white-space:nowrap}
.fig .k{font-size:13px;color:var(--ink2)}
.fig.dark{background:var(--ink);color:#fff}.fig.dark .k{color:#B9BEC4}
@media(min-width:700px){.figs{grid-template-columns:1fr 3fr}}
.fig.next .v{white-space:normal;font-size:20px;margin:2px 0}
@media(max-width:600px){th,td{padding:7px 6px;font-size:12.5px}td.r,th.r{white-space:nowrap}table{display:block;overflow-x:auto}}
h2{font-size:17px;margin:26px 0 10px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.ev summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:58px 1fr 20px;gap:14px;align-items:center;padding:12px 16px}
.ev summary::-webkit-details-marker{display:none}
.ev .chev{color:var(--muted);font-size:22px;transition:transform .15s;justify-self:end}.ev[open] .chev{transform:rotate(90deg)}
.ev.past summary{opacity:.75}.ev[open] summary{opacity:1;border-bottom:1px solid var(--line2)}
.ev .body{padding:4px 16px 16px 88px}
.lbl{font-weight:600;font-size:14px;margin:16px 0 0}
@media(max-width:600px){.ev .body{padding:4px 14px 14px}}
.d{text-align:center;border:1px solid var(--line);border-radius:9px;padding:6px 0;line-height:1.1;align-self:start}
.d b{display:block;font-size:22px}.d span{font-size:12px;color:var(--muted)}
.t{font-weight:600;font-size:16px}
.m{color:var(--ink2);font-size:14px}
.money{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:14px}
.money b{font-weight:600}
.calw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.ch{font-size:12px;color:var(--muted);text-align:center;padding:3px 0}
.cd{min-height:78px;border:1px solid var(--line2);border-radius:6px;padding:3px;overflow:hidden}.cd.oth{opacity:.4}.cd.tod{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dn{font-size:12px;font-weight:600;color:var(--ink2)}.ce{background:var(--ink);color:#fff;border-radius:4px;font-size:11px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ce.cok{background:#2E7D4F}.ce.cx{background:#8B5E3C;text-decoration:line-through}
.cv{border-left:3px solid #C0392B;color:#C0392B;background:#FBEDEB;font-size:11px;padding:1px 4px;margin-top:2px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.leg{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:8px}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.yr.cm button{width:30px;height:30px;color:var(--ink);border-color:var(--line);background:var(--surface)}
@media(max-width:600px){.cd{min-height:54px;padding:2px}.ce,.cv{font-size:9.5px;padding:0 2px}}
.dovw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 14px}.dovw table{border:0}.dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.dovf{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}.dovf select,.dovf input,.dovf .btn{width:auto!important;margin:0!important;flex:0 0 auto}.dovf select,.dovf input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:14px}.lnk{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:13px}
table.split{margin-top:10px;font-size:13px;border-radius:8px;max-width:520px}table.split th,table.split td{padding:5px 10px}.pk{color:#2F7A4F;font-weight:700}.dimx{color:#B0B5BB}
.note{margin-top:8px;background:var(--paper);border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--ink2);margin-left:6px}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.tag.ok{color:var(--ok)}.tag.ok::before{background:var(--ok)}
.tag.warn{color:var(--warn)}.tag.warn::before{background:var(--warn)}
.tag.bad{color:var(--bad)}.tag.bad::before{background:var(--bad)}
.tag.on::before{background:var(--on)}
.empty{color:var(--ink2);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line2);font-size:14px}
th{color:var(--muted);font-weight:500}
.r{text-align:right}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.thumb img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}.file{display:inline-flex;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px;background:var(--paper)}
.foot{color:var(--muted);font-size:12.5px;margin-top:28px;text-align:center}
.out{background:transparent;border:1px solid #3A4048;color:#C9CDD2;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px}
</style>
</head>

const eur0=n=>Math.round(Number(n)||0).toLocaleString('sk-SK')+' €';
const MON=['jan','feb','mar','apr','máj','jún','júl','aug','sep','okt','nov','dec'];
const MONF=['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];

const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let DATA=null,YEAR=new Date().getFullYear();
function splitOf(e){const ms=DATA.members||['Tomi','Laci','Marian','Daniel','Adam'];const sp=e.split&&typeof e.split==='object'&&Object.keys(e.split).length?e.split:null;const names=sp?Object.keys(sp):ms;const fee=+e.fee||0;
  const set=names.filter(n=>sp&&sp[n]&&sp[n].base!==''&&sp[n].base!=null);const fixed=set.reduce((s,n)=>s+(+sp[n].base||0),0);const rest=names.length-set.length;const eq=rest?(fee-fixed)/rest:0;
  return names.map(n=>{const s=(sp||{})[n]||{};const base=set.includes(n)?(+s.base||0):eq;const fuel=+s.fuel||0;return {name:n,base,fuel,total:base+fuel,paid:sp?!!s.paid:e.status==='paid'}})}
const perMember=e=>{const f=+e.fee||0,m=Math.max(1,+e.members||5);return f/m};

async function unlock(user,pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+':'+pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function loginView(msg){
  $('#app').innerHTML=`<div class="login"><form class="card" id="lf"><h1 style="margin-bottom:20px">SB Kalendár</h1>
  <label for="u">Meno</label><input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label for="p">Heslo</label><input id="p" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <button class="btn" id="go">Prihlásiť sa</button><div class="err" id="err">${esc(msg||'')}</div></form></div>`;
  $('#u').focus();
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#go');b.disabled=true;b.textContent='Overujem…';
    try{DATA=await unlock($('#u').value,$('#p').value);try{sessionStorage.setItem('kap',JSON.stringify([$('#u').value,$('#p').value]))}catch(x){}render()}

}

async function dovApi(body){const D=DATA.dov;if(!D)return;const r=body?await fetch(D.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,k:D.k})}):await fetch(D.url+'?k='+encodeURIComponent(D.k),{cache:'no-store'});

let CM=null;
function calBox(){const all=DATA.events||[];if(!CM){const n=new Date();CM=new Date(n.getFullYear(),n.getMonth(),1)}const M=CM;const t=today();
  const MN=['január','február','marec','apríl','máj','jún','júl','august','september','október','november','december'];const p2=n=>String(n).padStart(2,'0');
  const first=new Date(M);first.setDate(1-((M.getDay()+6)%7));let cells='';
  for(let i=0;i<42;i++){const d=new Date(first);d.setDate(first.getDate()+i);const ds=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
    const de=all.filter(e=>e.date===ds),dv=dovOn(ds);
    cells+=`<div class="cd${d.getMonth()!==M.getMonth()?' oth':''}${ds===t?' tod':''}"><div class="dn">${d.getDate()}</div>${de.map(e=>`<div class="ce ${e.status==='cancel'?'cx':['ok','done','paid'].includes(e.status)?'cok':''}" title="${esc(e.title||e.type)}">${esc(e.time?e.time+' ':'')}${esc(e.title||e.type)}</div>`).join('')}${dv.map(x=>`<div class="cv" title="${esc(x.kto)} – dovolenka">${esc(x.kto)}</div>`).join('')}</div>`}
  return `<h2 style="display:flex;justify-content:space-between;align-items:center;gap:10px">Kalendár<span class="yr cm"><button id="cmp" aria-label="Predošlý mesiac">‹</button><span style="min-width:130px;text-align:center;text-transform:capitalize;font-size:15px">${MN[M.getMonth()]} ${M.getFullYear()}</span><button id="cmn" aria-label="Ďalší mesiac">›</button></span></h2>
   <div class="calw"><div class="cg">${['Po','Ut','St','Št','Pi','So','Ne'].map(x=>`<div class="ch">${x}</div>`).join('')}${cells}</div>
   <div class="leg"><span><i style="background:#2E7D4F"></i>potvrdené</span><span><i style="background:#8B5E3C"></i>zrušené</span>${DATA.dov?'<span><i style="background:#C0392B"></i>dovolenka</span>':''}</div></div>`}
function dovBox(){if(!DATA.dov)return '';const t=today();const up=(DOV||[]).filter(x=>x.do>=t);const fd=s=>{const d=new Date(s+'T12:00');return d.getDate()+'. '+(d.getMonth()+1)+'.'};
  return `<h2>Dovolenky</h2><div class="dovw">${DOV===null?'<div class="empty">Načítavam…</div>':up.length?`<table><tbody>${up.map(x=>`<tr><td><span class="dot2" style="background:#C0392B"></span><b>${esc(x.kto)}</b></td><td>${fd(x.od)}${x.do!==x.od?' – '+fd(x.do):''}</td><td class="r" style="white-space:nowrap"><button class="lnk" data-ed="${esc(x.id)}">Upraviť</button> <button class="lnk" data-del="${esc(x.id)}">Zmazať</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Žiadne naplánované dovolenky.</div>'}
   <form id="dovf" class="dovf"><input type="hidden" name="id"><select name="kto">${(DATA.members||[]).map(n=>`<option>${esc(n)}</option>`).join('')}</select><input type="date" name="od" required value="${t}"><input type="date" name="do" required value="${t}"><button class="btn sm">Pridať dovolenku</button></form></div>`}
function evCard(e){const s=EST[e.status]||EST.lead;const f=+e.fee||0,n=+e.fuel||0;const past=e.date<today();
  return `<details class="ev${past?' past':''}"><summary>${dateBox(e.date)}<div class="sm">
    <div class="t">${esc(e.title||e.type)}<span class="tag ${s[1]}">${s[0]}</span></div>
    <div class="m">${esc([e.type,e.time,e.venue,e.city].filter(Boolean).join(' · '))}</div>${e.status!=='cancel'&&dovOn(e.date).length?`<div class="m" style="color:#A86500">⚠ dovolenka: ${esc(dovOn(e.date).map(x=>x.kto).join(', '))}</div>`:''}</div><span class="chev" aria-hidden="true">›</span></summary>
   <div class="body">
   ${f||n?`<div class="money"><span>Dohodnuté <b>${eur(f)}</b></span>${n?`<span>Nafta <b>${eur(n)}</b></span><span>Spolu za akciu <b>${eur(f+n)}</b></span>`:''}</div>`:''}
   ${+e.deposit?`<div class="money"><span>Záloha <b>${eur(e.deposit)}</b>${e.depositBy?` (u ${esc({Laci:'Laciho',Tomi:'Tomiho'}[e.depositBy]||e.depositBy)})`:''}<span class="tag ${e.depositPaid?'ok':'warn'}">${e.depositPaid?'prijatá':'čaká sa'}</span></span>${f?`<span>Doplatok <b>${eur(f+n-(+e.deposit||0))}</b></span>`:''}</div>`:''}
   ${e.contact||e.contactEmail?`<div class="m" style="margin-top:8px">Kontakt: ${esc([e.contact,e.contactEmail].filter(Boolean).join(', '))}</div>`:''}
   ${e.notes?`<div class="note">${esc(e.notes)}</div>`:''}
   ${(e.files||[]).length?`<div class="files">${e.files.map(f=>/^image\//.test(f.type)?`<a href="${esc(f.url)}" target="_blank" rel="noopener" class="thumb"><img src="${esc(f.url)}" alt="${esc(f.name)}"></a>`:`<a href="${esc(f.url)}" target="_blank" rel="noopener" class="file">PDF · ${esc(f.name)}</a>`).join('')}</div>`:''}
   ${f&&e.status!=='cancel'?`<div class="lbl">Kto koľko dostane</div><table class="split"><thead><tr><th>Člen</th><th class="r">Z ceny</th><th class="r">Nafta</th><th class="r">Spolu</th><th class="r">Vyplatené</th></tr></thead><tbody>${splitOf(e).map(r=>`<tr><td>${esc(r.name)}</td><td class="r">${eur(r.base)}</td><td class="r">${r.fuel?eur(r.fuel):'—'}</td><td class="r"><b>${eur(r.total)}</b></td><td class="r">${r.paid?'<span class="pk">✓</span>':'<span class="dimx">—</span>'}</td></tr>`).join('')}</tbody></table>`:''}
   </div></details>`}
function render(){
  const all=DATA.events||[];const t=today();const y=String(YEAR);
  const yr=all.filter(e=>(e.date||'').startsWith(y)&&e.status!=='cancel');const gigs=yr.filter(e=>e.type!=='Skúška');
  const sum=a=>a.reduce((s,e)=>s+(+e.fee||0),0),fuel=a=>a.reduce((s,e)=>s+(+e.fuel||0),0),pm=a=>a.reduce((s,e)=>s+(+e.fee?perMember(e):0),0);
  const up=all.filter(e=>e.date>=t&&e.status!=='cancel');
  const allY=all.filter(e=>(e.date||'').startsWith(y)).sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
  const byM=Array(12).fill(0).map(()=>({n:0,s:0,p:0}));gigs.forEach(e=>{const m=+e.date.slice(5,7)-1;byM[m].n++;byM[m].s+=(+e.fee||0)+(+e.fuel||0);byM[m].p+=+e.fee?perMember(e):0});
  $('#app').innerHTML=`<header><div class="row"><div><h1>SB Kalendár</h1><small>Aktualizované ${esc(DATA.updated||'')}</small></div>
   <div style="display:flex;gap:10px;align-items:center"><div class="yr"><button aria-label="Predošlý rok" id="yp">‹</button><span>${YEAR}</span><button aria-label="Ďalší rok" id="yn">›</button></div><button class="out" id="lo">Odhlásiť</button></div></div></header>
  <main>
   <div class="figs">
    <div class="fig"><div class="v">${gigs.length}</div><div class="k">Akcií v roku ${y}</div></div>
    ${(()=>{const n=up[0];if(!n)return `<div class="fig dark next"><div class="k">Nasledujúca akcia</div><div class="v" style="font-size:17px">Zatiaľ nič naplánované</div></div>`;const d=new Date(n.date+'T12:00');
      return `<div class="fig dark next"><div class="k">Nasledujúca akcia</div><div class="v">${esc(n.title||n.type)}${n.city&&!(n.title||'').includes(n.city)?' · '+esc(n.city):''}</div><div class="k" style="color:#fff;font-size:14px">${d.toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}${n.time?', '+esc(n.time):''}</div></div>`})()}
   </div>
   ${up[0]?`<h2>Nasledujúca akcia</h2>${evCard(up[0])}`:''}
   ${calBox()}
   ${dovBox()}
   <h2>Akcie v roku ${y}</h2>
   ${(()=>{const l=allY.filter(e=>!up[0]||e.id!==up[0].id);return l.length?l.map(evCard).join(''):'<div class="empty">V tomto roku žiadne ďalšie akcie.</div>'})()}
   <h2>Prehľad po mesiacoch, ${y}</h2>
   ${gigs.length?`<table><thead><tr><th>Mesiac</th><th class="r">Akcií</th><th class="r">Spolu</th></tr></thead><tbody>${byM.map((v,i)=>v.n?`<tr><td>${MONF[i]}</td><td class="r">${v.n}</td><td class="r">${eur(v.s)}</td></tr>`:'').join('')}<tr><td><b>Spolu</b></td><td class="r"><b>${gigs.length}</b></td><td class="r"><b>${eur(sum(gigs)+fuel(gigs))}</b></td></tr></tbody></table>`:'<div class="empty">V tomto roku zatiaľ žiadne akcie.</div>'}
  </main>`;
  const df=$('#dovf');if(df)df.onsubmit=async ev=>{ev.preventDefault();const f=new FormData(df);if(f.get('do')<f.get('od')){alert('Koniec musí byť po začiatku');return}const b=df.querySelector('button');b.disabled=true;b.textContent='Ukladám…';try{const old=f.get('id');await dovApi({akcia:'pridat',kto:f.get('kto'),od:f.get('od'),do:f.get('do')});if(old)await dovApi({akcia:'zmazat',id:old})}catch(x){alert('Nepodarilo sa uložiť');b.disabled=false;b.textContent='Pridať dovolenku'}};
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const x=(DOV||[]).find(v=>v.id===b.dataset.ed);if(!x||!df)return;df.id.value=x.id;df.kto.value=x.kto;df.od.value=x.od;df.do.value=x.do;const s=df.querySelector('button');s.textContent='Uložiť zmenu';df.scrollIntoView({behavior:'smooth',block:'center'})});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Zmazať túto dovolenku?'))return;try{await dovApi({akcia:'zmazat',id:b.dataset.del})}catch(x){alert('Nepodarilo sa zmazať')}});
  const cp=$('#cmp'),cn=$('#cmn');if(cp)cp.onclick=()=>{CM=new Date(CM.getFullYear(),CM.getMonth()-1,1);render()};if(cn)cn.onclick=()=>{CM=new Date(CM.getFullYear(),CM.getMonth()+1,1);render()};
  if(DATA.dov&&DOV===null){DOV=[];dovApi().catch(()=>{})}
  $('#yp').onclick=()=>{YEAR--;render()};$('#yn').onclick=()=>{YEAR++;render()};
  $('#lo').onclick=()=>{DATA=null;try{sessionStorage.removeItem('kap')}catch(x){}loginView()};
}
(async()=>{let s=null;try{s=JSON.parse(sessionStorage.getItem('kap')||'null')}catch(x){}
  if(s){try{DATA=await unlock(s[0],s[1]);render();return}catch(x){}}loginView()})();
</script>
</body>
</html>
